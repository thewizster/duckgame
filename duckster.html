function drawBiomeFlash() {
    if (biomeFlash <= 0) return;
    var alpha = (biomeFlash / 30) * 0.45;

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);

}

// ==================== INPUT ====================
var keyHeld   = {};
var trickHeld = false;   // ↓ / S or the touch FLIP button

function goToAbilityPick() {
    var pool = unlockedAbilities();
    shuffleArray(pool);
    abilityChoices = pool.slice(0, 3);
    gpLevel = Math.min(Math.max(gpLevel, 1), meta.gpUnlocked);
    gameState = 'ABILITY_PICK';
    document.getElementById('hud').style.display = 'none';
}

function canvasPoint(ev) {
    var rect = canvas.getBoundingClientRect();
    return { x:(ev.clientX - rect.left) * (W / rect.width), y:(ev.clientY - rect.top) * (H / rect.height) };
}

document.addEventListener('keydown', function(e) {
    if ((e.code === 'Space' || e.code === 'ArrowDown') && gameState === 'PLAYING') e.preventDefault();
    if (e.code === 'ArrowDown' || e.code === 'KeyS') trickHeld = true;
    if (keyHeld[e.code]) return;
    keyHeld[e.code] = true;
    initAudio();

    if (gameState === 'TITLE') {
        if (e.code === 'KeyA') openAchievements('TITLE');
        else if (e.code === 'KeyG') gameState = 'GARAGE';
        else goToAbilityPick();
        return;
    }

    if (gameState === 'GARAGE') {
        var gi = ['Digit1', 'Digit2', 'Digit3', 'Digit4'].indexOf(e.code);
        if (gi !== -1) buyGarage(gi);
        else if (e.code === 'Escape' || e.code === 'KeyG' || e.code === 'Backspace') gameState = 'TITLE';
        return;
    }

    if (gameState === 'ACHIEVEMENTS') {
        if (e.code === 'Escape' || e.code === 'KeyA' || e.code === 'Enter' || e.code === 'Backspace') closeAchievements();
        return;
    }

    if (gameState === 'PAUSED') {
        if (e.code === 'Escape' || e.code === 'KeyP' || e.code === 'Space') { e.preventDefault(); resumeGame(); }
        else if (e.code === 'KeyQ') quitToTitle();
        return;
    }

    if (gameState === 'ABILITY_PICK') {
        if (e.code === 'Escape') { gameState = 'TITLE'; return; }
        if (e.code === 'ArrowLeft')  changeGp(-1);
        if (e.code === 'ArrowRight') changeGp(1);
        if (e.code === 'Digit1') selectAbility(0);
        if (e.code === 'Digit2') selectAbility(1);
        if (e.code === 'Digit3') selectAbility(2);
        return;
    }

    if (gameState === 'UPGRADE') {
        if (e.code === 'Digit1') applyUpgrade(0);
        if (e.code === 'Digit2') applyUpgrade(1);
        if (e.code === 'Digit3') applyUpgrade(2);
        if (e.code === 'KeyR')   rerollUpgrades();
        if (e.code === 'KeyH')   repairKart();
        return;
    }

    if (gameState === 'DEAD' || gameState === 'VICTORY') {
        if (victoryInputLock > 0) return;
        if (e.code === 'KeyR' || e.code === 'Space') goToAbilityPick();
        else if (e.code === 'KeyA') openAchievements(gameState);
        else if (e.code === 'KeyQ') quitToTitle();
        return;
    }

    if (gameState === 'PLAYING') {
        if (e.code === 'Escape' || e.code === 'KeyP')          { pauseGame(); return; }
        if (e.code === 'Space')                                { doJump(); }
        if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') { e.preventDefault(); doBoost(); }
    }
});

document.addEventListener('keyup', function(e) {
    keyHeld[e.code] = false;
    if (e.code === 'ArrowDown' || e.code === 'KeyS') trickHeld = false;
});

canvas.addEventListener('click', function(ev) {
    initAudio();
    var pt = canvasPoint(ev);
    mouseX = pt.x; mouseY = pt.y;

    for (var bi = 0; bi < uiButtons.length; bi++) {
        var btn = uiButtons[bi];
        if (mouseIn(btn)) { btn.action(); return; }
    }

    if (gameState === 'TITLE')        { goToAbilityPick(); return; }
    if (gameState === 'PAUSED')       { resumeGame(); return; }
    if (gameState === 'ACHIEVEMENTS') { closeAchievements(); return; }

    if (gameState === 'PLAYING') {
        if (pt.x < W / 2) doJump(); else doBoost();
    }
});

canvas.addEventListener('mousemove', function(ev) {
    var pt = canvasPoint(ev);
    mouseX = pt.x; mouseY = pt.y;
});

document.getElementById('jumpBtn').addEventListener('touchstart', function(e) {

    else if (gameState === 'PLAYING') doJump();
}, { passive: false });

document.getElementById('boostBtn').addEventListener('touchstart', function(e) {

}, { passive: false });

var trickBtn = document.getElementById('trickBtn');
trickBtn.addEventListener('touchstart', function(e) { e.preventDefault(); initAudio(); trickHeld = true; }, { passive: false });

trickBtn.addEventListener('touchcancel', function()  { trickHeld = false; });

document.getElementById('pauseBtn').addEventListener('touchstart', function(e) {

}, { passive: false });

// ==================== GAME LOOP ====================
function loop() {
    frameCount++;
    uiButtons = [];
    ctx.save();

    // Screen shake
    if (shakeFrames > 0) {
        ctx.translate(
            (Math.random() - 0.5) * shakeMagnitude * 2,
            (Math.random() - 0.5) * shakeMagnitude * 2
        );
        shakeFrames--;
    }

    if (gameState === 'TITLE') {
        drawTitleScreen();
        updateParticles();
        drawParticles();

    } else if (gameState === 'ABILITY_PICK') {
        drawAbilityPick();

    } else if (gameState === 'ACHIEVEMENTS') {
        drawAchievementsScreen();

    } else if (gameState === 'GARAGE') {
        drawGarageScreen();

    } else if (gameState === 'PLAYING' || gameState === 'UPGRADE' || gameState === 'PAUSED') {
        if (gameState !== 'PAUSED') {
            spawnBiomeParticles();
            generateObstacles();
            cullObstacles();
            spawnEnemies();
            generateCollectibles();
        }

        if (gameState === 'PLAYING') {
            updatePhysics();
            if (countdown <= 0) {
                updateCollectibles();
                updateEnemies();
                updateRivals();
                updateBoss();
            }
        }
        if (gameState !== 'PAUSED') updateParticles();

        drawBackground();
        drawBgParticles();
        drawRoad();
        drawObstacles();
        drawCollectibles();
        drawEnemies();
        drawRivals();
        drawBoss();
        drawBossShots();
        if (!isDying) drawKart(kart, KART_SCREEN_X, kart.y);
        drawParticles();
        drawBossUI();
        if (gameState === 'PLAYING') drawSpeedLines();
        drawBiomeFlash();
        drawCountdown();
        drawToasts();

        if (gameState === 'UPGRADE') drawUpgradeScreen();
        if (gameState === 'PAUSED')  drawPauseOverlay();

    } else if (gameState === 'DEAD') {
        drawBackground();
        drawRoad();
        drawObstacles();
        drawEnemies();
        ctx.fillStyle = 'rgba(0,0,0,0.65)';
        ctx.fillRect(0, 0, W, H);
        drawDeathScreen();
        drawToasts();

    } else if (gameState === 'VICTORY') {
        if (victoryInputLock > 0) victoryInputLock--;
        drawVictoryScreen();
        updateParticles();
        drawParticles();
        drawToasts();
    }

    ctx.restore();
    requestAnimationFrame(loop);
}

// ==================== FIT TO SCREEN ====================
// Scale the whole 806x506 game (canvas + border + HUD + touch buttons) to the window
function fitToScreen() {
    var s = Math.min(window.innerWidth / 806, (window.innerHeight - 34) / 506, 1.5);
    document.getElementById('gameContainer').style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fitToScreen);

// ==================== ENEMY SPAWNING ====================
function spawnEnemies() {
    if (boss) { nextEnemyX = Math.max(nextEnemyX, cameraX + GEN_AHEAD + 300); return; }
    while (nextEnemyX < cameraX + GEN_AHEAD) {
        var b    = BIOMES[currentBiomeIdx];
        var pool = b.enemies;
        var type = pool[Math.floor(Math.random() * pool.length)];
        var spd  = Math.min(5.0, 1.5 + distancePx * 0.00006) * gpMul();
        var gap  = (360 + Math.random() * 300) / (1 + (gpLevel - 1) * 0.2);
        var wx   = nextEnemyX;
        var e    = null;

        switch (type) {
            case 'gator':
                e = { type:'gator', worldX:wx, y:ROAD_Y-20, w:48, h:20,
                      speed:spd*0.7, dir:1, hp:2,
                      patrol:{min:wx-150,max:wx+180}, animFrame:0, animTimer:0 };
                break;
            case 'hawk':
                e = { type:'hawk', worldX:wx+200, y:80+Math.random()*80, w:36, h:16,
                      speed:spd*1.1, dir:-1, hp:1, diving:false, diveDy:0,
                      baseY:80+Math.random()*80, animFrame:0, animTimer:0 };
                break;
            case 'turtle':
                e = { type:'turtle', worldX:wx, y:ROAD_Y-18, w:32, h:18,
                      speed:spd*0.35, dir:1, hp:1, patrol:{min:wx-80,max:wx+100} };
                break;
            case 'snake':
                e = { type:'snake', worldX:wx, y:ROAD_Y-14, w:52, h:14,
                      speed:spd*0.85, dir:1, hp:1, baseY:ROAD_Y-14,
                      patrol:{min:wx-130,max:wx+150} };
                break;
            case 'vulture':
                e = { type:'vulture', worldX:wx+180, y:70+Math.random()*90, w:40, h:18,
                      speed:spd*1.0, dir:-1, hp:1, diving:false, diveDy:0,
                      baseY:70+Math.random()*90, animFrame:0, animTimer:0 };
                break;
            case 'tumbleweed':

            case 'taxi':

            case 'pigeon':

                      speed:spd*0.9, dir:-1, hp:1, diving:false, diveDy:0,
                      baseY:90+Math.random()*100, animFrame:0, animTimer:0 };
                break;
            case 'raccoon':
                e = { type:'raccoon', worldX:wx, y:ROAD_Y-28, w:28, h:28,
                      speed:spd*0.6, dir:1, hp:1, patrol:{min:wx-100,max:wx+120} };
                break;
            case 'yeti':
                e = { type:'yeti', worldX:wx, y:ROAD_Y-36, w:40, h:36,
                      speed:spd*0.5, dir:1, hp:3,
                      patrol:{min:wx-120,max:wx+150}, animFrame:0, animTimer:0 };
                break;
            case 'eagle':
                e = { type:'eagle', worldX:wx+220, y:55+Math.random()*80, w:44, h:18,
                      speed:spd*1.2, dir:-1, hp:1, diving:false, diveDy:0,
                      baseY:55+Math.random()*80, animFrame:0, animTimer:0 };
                break;
            case 'boulder':
                e = { type:'boulder', worldX:wx+260, y:ROAD_Y-28, w:32, h:28,

            case 'ufo':
                e = { type:'ufo', worldX:wx+150, y:50+Math.random()*70, w:50, h:22,

                break;
            case 'asteroid':
                e = { type:'asteroid', worldX:wx+250, y:10+Math.random()*50, w:30, h:28,

// ==================== ENEMY UPDATE ====================
function updateEnemies() {
    for (var i = enemies.length - 1; i >= 0; i--) {
        var e  = enemies[i];
        var sx = e.worldX - cameraX;

        // Cull far behind
        if (e.worldX + e.w < cameraX - CULL_BEHIND) { enemies.splice(i, 1); continue; }

        // Dead → FX + kill credit
        if (e.hp <= 0) {
            spawnExplosion(sx + e.w/2, e.y + e.h/2);
            sfxKill();
            kills++;
            enemies.splice(i, 1);
            continue;
        }

        // ── Per-type movement ──
        switch (e.type) {

            case 'gator':
            case 'turtle':
            case 'raccoon':
                e.worldX += e.speed * e.dir;
                if (e.worldX <= e.patrol.min || e.worldX + e.w >= e.patrol.max) e.dir *= -1;
                break;

            case 'snake':
                e.worldX += e.speed * e.dir;
                if (e.worldX <= e.patrol.min || e.worldX + e.w >= e.patrol.max) e.dir *= -1;
                e.y = e.baseY + Math.sin(frameCount * 0.13) * 7;
                break;

            case 'yeti':
                e.animTimer++;
                if (e.animTimer >= 14) { e.animTimer=0; e.animFrame=(e.animFrame+1)%2; }
                e.worldX += e.speed * e.dir;
                if (e.worldX <= e.patrol.min || e.worldX + e.w >= e.patrol.max) e.dir *= -1;
                if (frameCount % 90 === 0) { spawnDust(sx + e.w/2, ROAD_Y); sfxLand(); }
                break;

            case 'hawk':
            case 'vulture':
            case 'pigeon':
            case 'eagle':
                e.animTimer++;
                if (e.animTimer >= 10) { e.animTimer=0; e.animFrame=(e.animFrame+1)%2; }
                e.worldX += e.speed * e.dir;
                if (!e.diving && Math.abs(kart.worldX - e.worldX) < 180) {
                    e.diving = true; e.diveDy = 4.0 + e.speed * 0.25;
                }
                if (e.diving) {
                    e.y += e.diveDy;
                    if (e.y > ROAD_Y - 8 || e.y < 15) { e.diveDy *= -0.75; e.diving = (e.y > 60); }
                } else {
                    e.y = e.baseY + Math.sin(frameCount * 0.04 + e.worldX * 0.01) * 12;
                }
                if (e.worldX + e.w < cameraX - 120) { enemies.splice(i, 1); continue; }
                break;

            case 'tumbleweed':
                e.worldX += e.speed * e.dir;
                e.rotation += e.speed * 0.14;
                e.dy += GRAVITY * 0.55;
                e.y  += e.dy;
                if (e.y + e.h >= ROAD_Y) { e.y = ROAD_Y - e.h; e.dy = -(2.5 + Math.random()*2.5); }
                if (e.worldX + e.w < cameraX - 120) { enemies.splice(i, 1); continue; }
                break;

            case 'taxi':
                e.worldX += e.speed * e.dir;
                if (frameCount % 4 === 0)
                    spawnParticle(sx + e.w + 2, e.y + e.h/2,
                        1.5+Math.random()*2, (Math.random()-0.5)*1.5, 12, '#888899', 3);
                if (e.worldX + e.w < cameraX - 120) { enemies.splice(i, 1); continue; }
                break;

            case 'boulder':
                e.worldX += e.speed * e.dir;
                e.rotation += e.speed * 0.11;
                if (frameCount % 4 === 0) spawnDust(sx + e.w/2, ROAD_Y);
                if (e.worldX + e.w < cameraX - 120) { enemies.splice(i, 1); continue; }
                break;

            case 'ufo':
                e.worldX += e.speed * e.dir;
                e.y = e.baseY + Math.sin(frameCount * 0.036) * 18;
                e.beamTimer++;
                if (e.beamTimer > 200) { e.beamActive = true; e.beamTimer = 0; }
                if (e.beamActive && ++e.beamTimer > 55) e.beamActive = false;
                // Beam damage when kart is directly below
                if (e.beamActive && Math.abs(kart.worldX - e.worldX - e.w/2) < 28)
                    hurtKart(HIT_DAMAGE);
                if (e.worldX + e.w < cameraX - 120) { enemies.splice(i, 1); continue; }
                break;

            case 'asteroid':
                e.worldX += e.speed * e.dir;
                e.y       += e.dy;
                e.rotation += 0.12;
                if (frameCount % 3 === 0)
                    spawnParticle(sx+e.w/2, e.y, Math.random()*2-1, -1-Math.random(), 10, '#888888', 2);
                if (e.worldX + e.w < cameraX - 120 || e.y > H) { enemies.splice(i, 1); continue; }
                break;

            case 'drone':
                // Chase kart from behind/above
                var dtx = kart.worldX - e.worldX;
                var dty = (kart.y + kart.h/2) - (e.y + e.h/2);
                e.worldX += e.speed * 0.5 + (dtx > 0 ? e.speed * 0.6 : 0);
                e.y += dty * 0.025;
                e.animTimer++;
                if (e.animTimer >= 4) { e.animTimer=0; e.animFrame=(e.animFrame+1)%2; }
                if (e.worldX + e.w < cameraX - 120) { enemies.splice(i, 1); continue; }
                break;
        }

        // ── Kart collision ──
        if (kart.invincible > 0 || !kart.alive || isDying) continue;
        sx = e.worldX - cameraX;
        var ks  = KART_SCREEN_X;
        var okx = ks + kart.w - 5 > sx + 3 && ks + 5 < sx + e.w - 3;
        var oky = kart.y + kart.h - 5 > e.y + 3 && kart.y + 5 < e.y + e.h - 3;
        if (!okx || !oky) continue;

        // Boost ram: smash anything in the way
        if (kart.boostTimer > 0) {
            e.hp = 0;
            shakeFrames = 4; shakeMagnitude = 3;
        // Stomp: falling fast onto top third of enemy
        } else if (kart.dy > 1.5 && kart.y + kart.h <= e.y + e.h * 0.38 + 4) {
            e.hp = 0;
            kart.dy = -5.5; kart.state = 'air'; kart.invincible = 28;
        } else {
            hurtKart(HIT_DAMAGE, sx + e.w/2, e.y + e.h/2);
        }
    }
}

// ==================== ENEMY DRAWING ====================
function drawEnemies() {
    for (var i = 0; i < enemies.length; i++) {
        var e  = enemies[i];
        var sx = e.worldX - cameraX;
        if (sx + e.w < -60 || sx > W + 60) continue;
        switch (e.type) {
            case 'gator':     _drawGator(sx, e);     break;
            case 'hawk':      _drawHawk(sx, e);      break;
            case 'turtle':    _drawTurtle(sx, e);    break;
            case 'snake':     _drawSnake(sx, e);     break;
            case 'vulture':   _drawVulture(sx, e);   break;
            case 'tumbleweed':_drawTumbleweed(sx, e);break;
            case 'taxi':      _drawTaxi(sx, e);      break;
            case 'pigeon':    _drawPigeon(sx, e);    break;
            case 'raccoon':   _drawRaccoon(sx, e);   break;
            case 'yeti':      _drawYeti(sx, e);      break;
            case 'eagle':     _drawEagle(sx, e);     break;
            case 'boulder':   _drawBoulder(sx, e);   break;
            case 'ufo':       _drawUfo(sx, e);       break;
            case 'asteroid':  _drawAsteroid(sx, e);  break;
            case 'drone':     _drawDrone(sx, e);     break;
        }
    }
}

function _drawGator(sx, e) {
    var x = sx, y = e.y;
    ctx.save();
    if (e.dir < 0) { ctx.translate(sx + e.w, 0); ctx.scale(-1,1); x = 0; }
    ctx.fillStyle = '#3a7d44';
    ctx.fillRect(x, y+6, 48, 14);                 // body
    ctx.fillRect(x+38, y+10, 14, 8);              // snout
    ctx.fillStyle = '#2d6035';
    for (var b=0;b<3;b++) ctx.fillRect(x+8+b*12, y+2, 8, 8);  // ridges
    ctx.fillStyle = '#ffff00';
    ctx.fillRect(x+30, y+6, 5, 5);
    ctx.fillStyle = '#000000';
    ctx.fillRect(x+31, y+7, 3, 3);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x+40, y+18, 3, 4);
    ctx.fillRect(x+46, y+18, 3, 4);               // teeth
    ctx.restore();
}

function _drawHawk(sx, e) {
    var x = sx, y = e.y;
    var f = e.animFrame % 2;
    ctx.fillStyle = '#7a4a18';
    ctx.fillRect(x+10, y+4, 16, 10);              // body
    ctx.fillStyle = '#5a3210';
    // Wings
    if (f === 0) {
        ctx.fillRect(x, y, 10, 10);               // left wing up
        ctx.fillRect(x+26, y, 10, 10);            // right wing up
    } else {
        ctx.fillRect(x-2, y+6, 12, 6);            // wings down
        ctx.fillRect(x+26, y+6, 12, 6);
    }
    ctx.fillStyle = '#ffcc44';
    ctx.fillRect(x+24, y+6, 4, 4);               // beak
    ctx.fillStyle = '#000000';
    ctx.fillRect(x+22, y+4, 4, 4);               // eye
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x+23, y+5, 2, 2);
}

function _drawTurtle(sx, e) {
    var x = sx, y = e.y;
    // Shell
    ctx.fillStyle = '#3a7a30';
    ctx.fillRect(x+4, y, 24, 16);
    ctx.fillStyle = '#2a6020';
    for (var tc=0;tc<3;tc++) ctx.fillRect(x+6+tc*8, y+2, 6, 6);
    // Head
    ctx.fillStyle = '#5a9040';
    ctx.fillRect(x+22, y+8, 10, 8);
    ctx.fillStyle = '#000000';
    ctx.fillRect(x+28, y+10, 3, 3);
    // Feet
    ctx.fillStyle = '#5a9040';
    ctx.fillRect(x+2, y+13, 6, 5);
    ctx.fillRect(x+24, y+13, 6, 5);
}

function _drawSnake(sx, e) {
    var x = sx, y = e.y;
    var wave = Math.sin(frameCount * 0.12);
    ctx.fillStyle = '#c0801a';
    for (var seg=0; seg<5; seg++) {
        var sy2 = y + wave * Math.sin(seg * 0.9) * 5;
        ctx.fillRect(x + seg*10, sy2, 12, 12);
    }
    ctx.fillStyle = '#e0a030';                    // head
    ctx.fillRect(x+42, y-2, 14, 14);
    ctx.fillStyle = '#000000';
    ctx.fillRect(x+50, y+1, 4, 4);
    ctx.fillStyle = '#ff0000';                    // tongue
    ctx.fillRect(x+54, y+5, 6, 2);
    ctx.fillRect(x+58, y+3, 2, 2);
    ctx.fillRect(x+58, y+7, 2, 2);
    // Pattern on body
    ctx.fillStyle = '#a06010';
    for (var sp=0; sp<4; sp++) ctx.fillRect(x+4+sp*10, y+3, 5, 6);
}

function _drawVulture(sx, e) {
    var x = sx, y = e.y;
    var f = e.animFrame % 2;
    ctx.fillStyle = '#2a2218';                    // dark body
    ctx.fillRect(x+10, y+6, 20, 12);
    ctx.fillStyle = '#1a1610';
    if (f === 0) {
        ctx.fillRect(x, y+2, 10, 10);
        ctx.fillRect(x+30, y+2, 10, 10);
    } else {
        ctx.fillRect(x, y+8, 10, 6);
        ctx.fillRect(x+30, y+8, 10, 6);
    }
    ctx.fillStyle = '#cc2200';                    // bald red head
    ctx.fillRect(x+24, y, 10, 10);
    ctx.fillStyle = '#aa3300';
    ctx.fillRect(x+30, y+7, 6, 4);               // hooked beak
    ctx.fillStyle = '#000000';
    ctx.fillRect(x+26, y+2, 4, 4);
}

function _drawTumbleweed(sx, e) {
    var x = sx + e.w/2, y = e.y + e.h/2;
    var r = e.w/2 - 1;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(e.rotation || 0);
    ctx.fillStyle = '#8a5a20';
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#c08030';
    // Spoke lines
    for (var sp=0; sp<6; sp++) {
        var a = (sp / 6) * Math.PI * 2;
        ctx.fillRect(-2, -r+2, 4, r*2-4);
        ctx.rotate(Math.PI/6);
    }
    ctx.fillStyle = '#6a4010';
    ctx.beginPath(); ctx.arc(0, 0, r*0.35, 0, Math.PI*2); ctx.fill();
    ctx.restore();
}

function _drawTaxi(sx, e) {
    var x = sx, y = e.y;
    ctx.save();
    if (e.dir < 0) { ctx.translate(sx + e.w, 0); ctx.scale(-1,1); x = 0; }
    // Body
    ctx.fillStyle = '#ffcc00';
    ctx.fillRect(x+2, y+8, 54, 18);
    // Roof
    ctx.fillStyle = '#ffdd44';
    ctx.fillRect(x+12, y, 34, 12);
    // Checkerboard stripe
    for (var ch=0; ch<8; ch++) {
        ctx.fillStyle = ch%2===0 ? '#000000' : '#ffcc00';
        ctx.fillRect(x+2+ch*7, y+22, 7, 4);
    }
    // Windows
    ctx.fillStyle = '#88aacc';
    ctx.fillRect(x+14, y+2, 12, 8);
    ctx.fillRect(x+30, y+2, 12, 8);
    // Headlights
    ctx.fillStyle = '#ffff88';
    ctx.fillRect(x+46, y+10, 8, 6);
    // Wheels
    ctx.fillStyle = '#222222';
    ctx.fillRect(x+4, y+22, 14, 10);
    ctx.fillRect(x+40, y+22, 14, 10);
    ctx.fillStyle = '#888888';
    ctx.fillRect(x+8, y+25, 6, 4);
    ctx.fillRect(x+44, y+25, 6, 4);
    ctx.restore();
}

function _drawPigeon(sx, e) {
    var x = sx, y = e.y;
    var f = e.animFrame % 2;
    ctx.fillStyle = '#888898';
    ctx.fillRect(x+6, y+4, 16, 8);
    ctx.fillStyle = '#aaaacc';
    if (f === 0) {
        ctx.fillRect(x, y, 6, 8);
        ctx.fillRect(x+22, y, 6, 8);
    } else {
        ctx.fillRect(x, y+5, 6, 5);
        ctx.fillRect(x+22, y+5, 6, 5);
    }
    ctx.fillStyle = '#ccccee';
    ctx.fillRect(x+10, y, 8, 6);                  // head
    ctx.fillStyle = '#ff6644';
    ctx.fillRect(x+16, y+3, 4, 3);                // beak
    ctx.fillStyle = '#000000';
    ctx.fillRect(x+12, y+1, 3, 3);
    // Iridescent neck patch
    ctx.fillStyle = 'rgba(150,80,200,0.50)';
    ctx.fillRect(x+7, y+4, 8, 4);
}

function _drawRaccoon(sx, e) {
    var x = sx, y = e.y;
    ctx.save();
    if (e.dir < 0) { ctx.translate(sx + e.w, 0); ctx.scale(-1,1); x = 0; }
    ctx.fillStyle = '#888888';
    ctx.fillRect(x+4, y+10, 20, 18);              // body
    ctx.fillRect(x+14, y, 12, 14);                // head
    ctx.fillStyle = '#555555';                    // tail
    ctx.fillRect(x, y+16, 6, 12);
    ctx.fillStyle = '#cccccc';
    for (var rb=0;rb<3;rb++) ctx.fillRect(x, y+17+rb*3, 6, 2);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x+14, y+2, 12, 6);               // white face
    ctx.fillStyle = '#000000';                    // mask
    ctx.fillRect(x+15, y+3, 4, 4);
    ctx.fillRect(x+21, y+3, 4, 4);
    ctx.fillStyle = '#ff8844';
    ctx.fillRect(x+21, y+9, 5, 3);               // snout
    ctx.restore();
}

function _drawYeti(sx, e) {
    var x = sx, y = e.y;
    var f = e.animFrame % 2;
    ctx.save();
    if (e.dir < 0) { ctx.translate(sx + e.w, 0); ctx.scale(-1,1); x = 0; }
    ctx.fillStyle = '#e0e8f0';
    ctx.fillRect(x+6, y+14, 28, 22);              // body
    ctx.fillRect(x+10, y, 20, 18);               // head
    // Arms
    if (f === 0) {
        ctx.fillRect(x, y+14, 8, 18);
        ctx.fillRect(x+32, y+14, 8, 18);
    } else {
        ctx.fillRect(x-2, y+10, 8, 18);
        ctx.fillRect(x+34, y+10, 8, 18);
    }
    ctx.fillStyle = '#c8d8e8';                    // shading
    ctx.fillRect(x+8, y+16, 24, 10);
    ctx.fillStyle = '#ee1111';                    // angry eyes
    ctx.fillRect(x+12, y+4, 6, 6);
    ctx.fillRect(x+22, y+4, 6, 6);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x+13, y+5, 3, 3);
    ctx.fillRect(x+23, y+5, 3, 3);
    ctx.fillStyle = '#cccccc';                    // claws
    ctx.fillRect(x, y+30, 4, 4);
    ctx.fillRect(x+4, y+30, 4, 4);
    ctx.fillRect(x+32, y+30, 4, 4);
    ctx.fillRect(x+36, y+30, 4, 4);
    ctx.restore();
}

function _drawEagle(sx, e) {
    var x = sx, y = e.y;
    var f = e.animFrame % 2;
    ctx.fillStyle = '#5a3010';                    // brown body
    ctx.fillRect(x+14, y+4, 16, 12);
    ctx.fillStyle = '#ffffff';                    // white head
    ctx.fillRect(x+26, y, 14, 12);
    ctx.fillStyle = '#ffcc00';                    // yellow beak
    ctx.fillRect(x+38, y+7, 6, 4);
    ctx.fillStyle = '#000000';
    ctx.fillRect(x+30, y+2, 5, 5);               // eye
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x+31, y+3, 2, 2);
    // Wide wings
    ctx.fillStyle = '#3a2008';
    if (f === 0) {
        ctx.fillRect(x, y-2, 14, 10);
        ctx.fillRect(x+30, y-2, 14, 10);
    } else {
        ctx.fillRect(x, y+6, 14, 8);
        ctx.fillRect(x+30, y+6, 14, 8);
    }
    // Tail feathers
    ctx.fillStyle = '#5a3010';
    ctx.fillRect(x+8, y+12, 8, 6);
    ctx.fillStyle = '#ffcc00';                    // talons
    ctx.fillRect(x+14, y+14, 4, 4);
    ctx.fillRect(x+22, y+14, 4, 4);
}

function _drawBoulder(sx, e) {
    var x = sx + e.w/2, y = e.y + e.h/2;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(e.rotation || 0);
    ctx.fillStyle = '#888888';
    ctx.fillRect(-14, -12, 28, 24);
    ctx.fillStyle = '#707070';
    ctx.fillRect(-14, -12, 28, 8);
    ctx.fillStyle = '#aaaaaa';                    // highlights
    ctx.fillRect(-12, -10, 8, 5);
    ctx.fillStyle = '#505050';                    // cracks
    ctx.fillRect(-2, -6, 2, 14);
    ctx.fillRect(-8, 2, 18, 2);
    ctx.restore();
}

function _drawUfo(sx, e) {
    var x = sx, y = e.y;
    // Saucer dish
    ctx.fillStyle = '#8888cc';
    ctx.fillRect(x+8, y+10, 34, 10);
    ctx.fillStyle = '#aaaaee';
    ctx.fillRect(x+4, y+12, 42, 6);              // highlight
    // Dome
    ctx.fillStyle = '#44cc44';
    ctx.fillRect(x+16, y, 18, 14);
    ctx.fillStyle = '#66ee66';
    ctx.fillRect(x+18, y+2, 10, 5);              // dome glass
    // Beam when active
    if (e.beamActive) {
        var alpha = 0.25 + Math.sin(frameCount * 0.3) * 0.15;
        ctx.fillStyle = 'rgba(100,255,100,' + alpha + ')';
        ctx.fillRect(x+20, y+20, 10, ROAD_Y - e.y - 20);
    }
    // Blinking lights
    ctx.fillStyle = frameCount % 20 < 10 ? '#ff4444' : '#ffff44';
    ctx.fillRect(x+8, y+12, 4, 4);
    ctx.fillRect(x+38, y+12, 4, 4);
    // Underside glow
    ctx.fillStyle = 'rgba(100,255,100,0.20)';
    ctx.fillRect(x+4, y+18, 42, 4);
}

function _drawAsteroid(sx, e) {
    var x = sx + e.w/2, y = e.y + e.h/2;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(e.rotation || 0);
    ctx.fillStyle = '#888080';
    // Jagged shape via overlapping rects
    ctx.fillRect(-12, -10, 24, 20);
    ctx.fillRect(-8,  -14, 16, 28);
    ctx.fillRect(-14, -6,  28, 12);
    ctx.fillStyle = '#666060';                    // craters
    ctx.fillRect(-6, -4, 6, 6);
    ctx.fillRect(2, 2, 5, 5);
    ctx.fillStyle = '#aaaaaa';                    // sheen
    ctx.fillRect(-10, -8, 5, 4);
    ctx.restore();
}

function _drawDrone(sx, e) {
    var x = sx, y = e.y;
    var f = e.animFrame % 2;
    ctx.fillStyle = '#333344';
    ctx.fillRect(x+8, y+4, 18, 10);              // body
    ctx.fillStyle = '#222233';
    ctx.fillRect(x+12, y+6, 10, 6);              // detail
    // Rotors
    ctx.fillStyle = '#555566';
    ctx.fillRect(x, y, 10, 4);                   // rear arm
    ctx.fillRect(x+24, y, 10, 4);                // front arm
    ctx.fillStyle = f===0 ? '#aaaacc' : '#8888aa';
    ctx.fillRect(x-4, y-2, 14, 2);              // spinning rotor back
    ctx.fillRect(x+24, y-2, 14, 2);             // spinning rotor front
    // Eye / camera
    ctx.fillStyle = '#ff2222';
    ctx.fillRect(x+25, y+5, 5, 5);
    ctx.fillStyle = '#ff8888';
    ctx.fillRect(x+26, y+6, 2, 2);
    // Exhaust
    if (frameCount % 3 === 0)
        spawnParticle(x+2, y+10, -1-Math.random(), (Math.random()-0.5)*0.5, 6, '#888899', 2);
}

// ==================== COLLECTIBLE GENERATION ====================
function generateCollectibles() {
    while (nextCollectibleX < cameraX + GEN_AHEAD) {
        var roll = Math.random();
        // corn=50%, breadcrumb=25%, fuel_can=15%, heart=10%
        var type;
        if      (roll < 0.50) type = 'corn';
        else if (roll < 0.75) type = 'breadcrumb';
        else if (roll < 0.90) type = 'fuel_can';
        else                  type = 'heart';

        var cy = ROAD_Y - 45 - Math.random() * 60;  // float above road
        collectibles.push({
            type:       type,
            worldX:     nextCollectibleX,
            y:          cy,
            bobOffset:  Math.random() * Math.PI * 2,
            collected:  false
        });
        nextCollectibleX += 150 + Math.random() * 180;
    }
}

// ==================== COLLECTIBLE UPDATE ====================
function updateCollectibles() {
    var magnetRange = activeUpgrades.indexOf('magnet') !== -1 ? 130 : 0;
    for (var i = collectibles.length - 1; i >= 0; i--) {
        var c = collectibles[i];
        if (c.collected)                          { collectibles.splice(i,1); continue; }
        if (c.worldX < cameraX - CULL_BEHIND)    { collectibles.splice(i,1); continue; }

        var cdx  = kart.worldX - c.worldX;
        var cdy  = (kart.y + kart.h/2) - c.y;
        var dist = Math.sqrt(cdx*cdx + cdy*cdy);

        // Magnet pull
        if (magnetRange > 0 && dist < magnetRange && dist > 1) {
            c.worldX += (cdx / dist) * 6;
            c.y      += (cdy / dist) * 6;
        }

        // Pickup radius
        if (dist < 26) {
            c.collected = true;
            spawnCollectFX(c.worldX - cameraX, c.y);
            sfxCollect();
            if      (c.type === 'corn')       { addCorn(1); }
            else if (c.type === 'breadcrumb') { addCorn(3); }
            else if (c.type === 'fuel_can')   { kart.boostCharges++; updateHUD(); }
            else if (c.type === 'heart')      { kart.hp = Math.min(kart.maxHp, kart.hp + 30); updateHUD(); }
        }
    }
}

// ==================== COLLECTIBLE DRAWING ====================
function drawCollectibles() {
    for (var i = 0; i < collectibles.length; i++) {
        var c = collectibles[i];
        if (c.collected) continue;
        var sx = c.worldX - cameraX;
        if (sx < -20 || sx > W + 20) continue;
        var cy = c.y + Math.sin(frameCount * 0.09 + c.bobOffset) * 4;

        if (c.type === 'corn') {
            // Corn cob
            ctx.fillStyle = '#228822';            // husk leaves
            ctx.fillRect(sx-2, cy-4, 4, 18);
            ctx.fillRect(sx+8, cy-6, 4, 10);
            ctx.fillStyle = '#ffcc00';            // kernels
            ctx.fillRect(sx, cy, 10, 16);
            ctx.fillStyle = '#ffee44';
            for (var kr=0;kr<3;kr++)
                for (var kc=0;kc<2;kc++)
                    ctx.fillRect(sx+2+kc*5, cy+2+kr*5, 3, 3);
            ctx.fillStyle = '#ccaa00';
            ctx.fillRect(sx, cy, 10, 3);          // top shade

        } else if (c.type === 'breadcrumb') {
            // Golden sparkle cluster
            ctx.fillStyle = '#ddaa44';
            ctx.fillRect(sx-4, cy-4, 8, 8);
            ctx.fillStyle = '#ffee88';
            ctx.fillRect(sx-2, cy-2, 4, 4);
            // Sparkle rays
            ctx.fillStyle = '#ffcc44';
            ctx.fillRect(sx-6, cy, 4, 2);
            ctx.fillRect(sx+4, cy, 4, 2);
            ctx.fillRect(sx, cy-6, 2, 4);
            ctx.fillRect(sx, cy+4, 2, 4);

        } else if (c.type === 'fuel_can') {
            // Red fuel can
            ctx.fillStyle = '#cc2200';
            ctx.fillRect(sx-6, cy-8, 14, 18);
            ctx.fillStyle = '#ee4422';
            ctx.fillRect(sx-4, cy-6, 10, 6);     // top highlight
            ctx.fillStyle = '#881100';
            ctx.fillRect(sx-6, cy+6, 14, 4);     // bottom shade
            ctx.fillStyle = '#ffffff';            // label
            ctx.fillRect(sx-3, cy-2, 8, 6);
            ctx.fillStyle = '#cc2200';
            ctx.fillRect(sx-1, cy-1, 4, 4);      // cap
            ctx.fillStyle = '#888888';            // nozzle
            ctx.fillRect(sx+5, cy-10, 3, 6);

        } else if (c.type === 'heart') {
            // Pixel heart
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(sx-7, cy-7, 5, 8);
            ctx.fillRect(sx+2,  cy-7, 5, 8);
            ctx.fillRect(sx-8, cy-3, 16, 5);
            ctx.fillRect(sx-6, cy+1, 12, 4);
            ctx.fillRect(sx-3, cy+4,  6, 4);
            ctx.fillRect(sx-1, cy+7,  2, 3);
            // Shine
            ctx.fillStyle = '#ff8877';
            ctx.fillRect(sx-5, cy-5, 3, 3);
        }
    }
}

// ==================== BOOTSTRAP ====================
fitToScreen();
loop();
</script>
