<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Duckster: Road Rage</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding-bottom: 30px; /* room for the "choose a game" link */
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            user-select: none;
        }

        #gameContainer {
            position: relative;
            flex-shrink: 0;
            transform-origin: center center;
            box-shadow: 0 0 60px rgba(255, 160, 40, 0.4);
        }

        canvas {
            display: block;
            border: 3px solid #ffffff;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            touch-action: none;
        }

        /* ── HUD overlay ── */
        #hud {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            display: none;
        }

        #hudTopLeft {
            position: absolute;
            top: 8px; left: 10px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        #hpBarOuter {
            width: 130px;
            height: 13px;
            background: rgba(0,0,0,0.55);
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 2px;
            overflow: hidden;
        }

        #hpBarInner {
            height: 100%;
            width: 100%;
            background: #2ecc71;
            transition: width 0.12s linear, background 0.2s;
        }

        #boostDisplay {
            color: #ff9922;
            font-size: 13px;
            text-shadow: 1px 1px 0 #000;
            letter-spacing: 2px;
            min-height: 16px;
        }

        #upgradeIcons {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            max-width: 172px;
        }

        .chip {
            display: flex;
            align-items: center;
            gap: 3px;
            padding: 1px 5px 1px 2px;
            background: rgba(0,0,0,0.55);
            border: 1px solid;
            border-radius: 3px;
            color: #ffffff;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 0 #000;
        }

        .chip img {
            width: 16px;
            height: 16px;
            image-rendering: pixelated;
        }

        .chip.spent { opacity: 0.35; }

        #hudTopCenter {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }

        #distanceDisplay {
            color: #ffffff;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000000, -1px -1px 0 #000;
            letter-spacing: 2px;
        }

        #biomeDisplay {
            color: #cccccc;
            font-size: 11px;
            text-shadow: 1px 1px 0 #000;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        #posDisplay {
            color: #ffcc66;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 1px 1px 0 #000;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        #hudTopRight {
            position: absolute;
            top: 8px; right: 10px;
            text-align: right;
        }

        #cornDisplay {
            color: #ffe066;
            font-size: 14px;
            text-shadow: 1px 1px 0 #000;
        }

        #killDisplay {
            color: #ff9999;
            font-size: 12px;
            text-shadow: 1px 1px 0 #000;
            margin-top: 3px;
        }

        /* ── Touch buttons ── */
        #touchControls {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 110px;
            pointer-events: auto;
            display: none;
        }

        .touch-btn {
            position: absolute;
            bottom: 18px;
            width: 140px;
            height: 80px;
            background: rgba(255,255,255,0.13);
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 12px;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 1px 1px 0 #000;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        #jumpBtn  { left: 12px; }
        #boostBtn { right: 12px; }
        #trickBtn { left: 50%; transform: translateX(-50%); }

        #pauseBtn {
            position: absolute;
            top: 56px; right: 10px;
            width: 44px; height: 36px;
            display: none;
            pointer-events: auto;
            background: rgba(0,0,0,0.35);
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 8px;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            font-weight: bold;
            -webkit-tap-highlight-color: transparent;
        }

        @media (pointer: coarse) {
            #touchControls { display: block; }
            #pauseBtn      { display: block; }
        }
    </style>
</head>

// ==================== CANVAS SETUP ====================
const canvas = document.getElementById('gameCanvas');

// ==================== AUDIO ENGINE ====================
let audioCtx          = null;
let musicInterval     = null;
let isMusicPlaying    = false;
let musicStep         = 0;
let currentMusicBiome = -1;

function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playTone(freq, type, vol, dur, delay) {
    if (!audioCtx) return;
    delay = delay || 0;
    try {
        const osc  = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + delay + dur);
        osc.start(audioCtx.currentTime + delay);
        osc.stop(audioCtx.currentTime + delay + dur + 0.05);
    } catch(e) {}
}

// Note frequency table
const N = {
    C3:131,  D3:147,  E3:165,  F3:175,  G3:196,  A3:220,  B3:247,
    C4:262,  D4:294,  E4:330,  F4:349,  G4:392,  A4:440,  B4:494,
    C5:523,  D5:587,  E5:659,  F5:698,  G5:784,  A5:880,  B5:988,
    C6:1047, D6:1175, E6:1319,
    Eb4:311, Bb3:233, Bb4:466, Ab3:208, Ab4:415, F3s:185, Eb3:156, Eb5:622
};

// Per-biome music: racing themes, each with distinct feel
const BIOME_MUSIC = [
    // 0: Country Road — bright C-major jig, upbeat drive
    { seq:[N.C4,N.E4,N.G4,N.C5, N.G3,N.B3,N.D4,N.G4, N.A3,N.C4,N.E4,N.A4, N.F3,N.A3,N.C4,N.F4], tempo:130 },
    // 1: Desert Highway — A-minor twang, relentless groove
    { seq:[N.A3,N.A3,N.E4,N.A3, N.G3,N.G3,N.D4,N.G3, N.F3,N.A3,N.C4,N.A3, N.E3,N.A3,N.B3,N.E3], tempo:115 },
    // 2: City Streets — D-minor syncopated urban pulse
    { seq:[N.D4,N.F4,N.A4,N.D5, N.C4,N.Eb4,N.A4,N.C5, N.Bb3,N.D4,N.F4,N.Bb4, N.A3,N.C4,N.E4,N.A4], tempo:108 },
    // 3: Mountain Pass — G major open 5ths, majestic climb
    { seq:[N.G3,N.D4,N.G4,N.D4, N.C4,N.G4,N.C5,N.G4, N.A3,N.E4,N.A4,N.E4, N.F3,N.C4,N.F4,N.C4], tempo:148 },
    // 4: Space Highway — ethereal C-major 7th arpeggios
    { seq:[N.C5,N.G5,N.E5,N.C5, N.Ab4,N.Eb5,N.C5,N.Ab4, N.F4,N.C5,N.A4,N.F4, N.G4,N.D5,N.B4,N.G4], tempo:125 },
    // 5: Boss duel — driving E-minor chromatic stabs
    { seq:[N.E4,N.E4,N.G4,N.E4, N.Bb4,N.A4,N.G4,N.E4, N.E4,N.E4,N.G4,N.E4, N.B4,N.Bb4,N.A4,N.G4], tempo:100 }
];

function startMusic(biomeIdx) {
    if (musicInterval) { clearInterval(musicInterval); musicInterval = null; }
    if (biomeIdx === currentMusicBiome && isMusicPlaying) return;
    currentMusicBiome = biomeIdx;
    isMusicPlaying    = true;
    musicStep         = 0;
    const entry = BIOME_MUSIC[biomeIdx] || BIOME_MUSIC[0];
    const seq   = entry.seq;
    const tempo = entry.tempo;
    musicInterval = setInterval(function() {
        if (!isMusicPlaying || !audioCtx) return;
        const note = seq[musicStep % seq.length];
        if (note) {
            playTone(note, 'square', 0.07, (tempo / 1000) * 0.75);
            if (musicStep % 4 === 0) playTone(note / 2, 'triangle', 0.05, (tempo / 1000) * 1.4);
        }
        musicStep++;
    }, tempo);
}

function stopMusic() {
    isMusicPlaying = false;
    if (musicInterval) { clearInterval(musicInterval); musicInterval = null; }
    currentMusicBiome = -1;
}

function drawPixelIcon(art, x, y, px, c) {
    c = c || ctx;
    for (var r = 0; r < art.length; r++) {
        for (var k = 0; k < art[r].length; k++) {
            var col = ICON_PALETTE[art[r][k]];
            if (!col) continue;
            c.fillStyle = col;
            c.fillRect(x + k * px, y + r * px, px, px);
        }
    }
}

// Pre-render each icon to a data URL so the HTML HUD can show it as an <img>
var ICON_URLS = {};
(function() {
    for (var id in ICON_ART) {
        var cv = document.createElement('canvas');
        cv.width = 16; cv.height = 16;
        drawPixelIcon(ICON_ART[id], 0, 0, 2, cv.getContext('2d'));
        ICON_URLS[id] = cv.toDataURL();
    }
})();

const META_KEY = 'duckster_meta';

function loadMeta() {
    var m = null;
    try { m = JSON.parse(localStorage.getItem(META_KEY)); } catch(e) {}
    m = m || {};
    if (!m.achievements)                     m.achievements = [];
    if (typeof m.bestDistance !== 'number')  m.bestDistance = 0;
    if (typeof m.totalRuns    !== 'number')  m.totalRuns    = 0;
    if (typeof m.cornBank     !== 'number')  m.cornBank     = 0;
    if (typeof m.gpUnlocked   !== 'number')  m.gpUnlocked   = 1;
    if (!m.garage)                           m.garage       = {};
    GARAGE_DEFS.forEach(function(g) { if (typeof m.garage[g.id] !== 'number') m.garage[g.id] = 0; });
    return m;
}

function saveMeta() {
    try { localStorage.setItem(META_KEY, JSON.stringify(meta)); } catch(e) {}
}

function hasAchievement(id) { return meta.achievements.indexOf(id) !== -1; }

function unlockAchievement(id) {
    if (hasAchievement(id)) return;
    meta.achievements.push(id);
    saveMeta();
    const def = ACHIEVEMENT_DEFS.filter(function(a){ return a.id === id; })[0];
    if (def) toasts.push({ text:'ACHIEVEMENT: ' + def.name, timer:220 });
    var ab = abilityUnlockedBy(id);
    if (ab) toasts.push({ text:'NEW KART UNLOCKED: ' + ab.name, timer:260 });
}

function randBetween(a, b) { return a + Math.random() * (b - a); }
function randInt(a, b)     { return Math.floor(randBetween(a, b + 1)); }

function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
}

function wrapText(c, text, cx, y, maxW, lineH) {
    const words = text.split(' ');
    let line = '';
    for (let i = 0; i < words.length; i++) {
        const test = line + words[i] + ' ';
        if (c.measureText(test).width > maxW && line !== '') {
            c.fillText(line.trim(), cx, y);
            line = words[i] + ' ';
            y += lineH;
        } else { line = test; }
    }
    if (line.trim()) c.fillText(line.trim(), cx, y);
}

function formatTime(ms) {
    const s = Math.floor(ms / 1000);
    return Math.floor(s/60) + ':' + (s%60 < 10 ? '0' : '') + (s%60);
}

function distMeters() { return Math.floor(distancePx / 10); }

// Difficulty multiplier for the current Grand Prix: 1 at GP1, +25% per level
function gpMul() { return 1 + (gpLevel - 1) * 0.25; }

function zoneLabel() {
    return BIOMES[currentBiomeIdx].name + (gpLevel > 1 ? '  \u00B7  GP' + gpLevel : '');
}

function ordinal(n) {
    var sfx = (n % 100 >= 11 && n % 100 <= 13) ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th';
    return n + sfx;
}

function updateParticles() {
    for (var i = particles.length - 1; i >= 0; i--) {
        var p = particles[i];
        p.x  += p.dx;
        p.y  += p.dy;
        p.dy += 0.10;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
    for (var j = bgParticles.length - 1; j >= 0; j--) {
        var b = bgParticles[j];
        b.x += b.dx;
        b.y += b.dy;
        b.life--;
        if (b.life <= 0) bgParticles.splice(j, 1);
    }
}

function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        ctx.fillStyle   = p.color;
        ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
}

function drawBgParticles() {
    for (var i = 0; i < bgParticles.length; i++) {
        var p = bgParticles[i];
        ctx.globalAlpha = Math.min(1, p.life / 40) * 0.75;
        ctx.fillStyle   = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    ctx.globalAlpha = 1;
}

// Attacks: roll (ground projectile, jump it), lob (lands as a fire patch), drop (barrier behind the
// boss), brake (slides back under the kart, then sits dazed: stomp it or boost-ram it).
const BOSS_DEFS = [
    { name:'Tractor Ted',     w:96,  h:60, hp:3, roll:'#e8c040',
      attacks:[['roll', 'brake'], ['roll', 'roll', 'brake'], ['roll', 'drop', 'brake']] },

      attacks:[['roll', 'lob', 'brake'], ['lob', 'roll', 'brake'], ['lob', 'roll', 'lob', 'brake']] },
    { name:'Big Rig Rhonda',  w:112, h:66, hp:5, roll:'#222222',
      attacks:[['drop', 'roll', 'brake'], ['roll', 'drop', 'roll', 'brake'], ['drop', 'roll', 'lob', 'brake']] },
    { name:'Avalanche Al',    w:104, h:60, hp:6, roll:'#f0f8ff',
      attacks:[['roll', 'lob', 'brake'], ['lob', 'drop', 'roll', 'brake'], ['roll', 'lob', 'drop', 'roll', 'brake']] },
    { name:'Captain Cosmos',  w:100, h:54, hp:7, roll:'#66ff99',
      attacks:[['lob', 'roll', 'brake'], ['roll', 'lob', 'drop', 'brake'], ['lob', 'roll', 'lob', 'drop', 'brake']] }
];
const BOSS_HOME_X = 560;

// World distance (px) where biome i's boss appears: 220m before the next biome, or the finish line
function bossTriggerPx(i) {
    return (i < BIOMES.length - 1 ? BIOMES[i + 1].startDist : VICTORY_DIST) - 2200;
}

function checkBossTrigger() {
    var i = currentBiomeIdx;
    if (boss || bossDone[i] || distancePx < bossTriggerPx(i)) return;
    spawnBoss(i);
}

function spawnBoss(i) {
    var def = BOSS_DEFS[i];
    var hp  = def.hp + (gpLevel - 1) * 2;
    boss = { idx:i, def:def, x:W + 40, y:ROAD_Y - def.h, w:def.w, h:def.h, hp:hp, maxHp:hp,
             phase:0, state:'intro', timer:0, attackIdx:0, invuln:0, hitFlash:0, shots:0 };
    bossShots = [];
    // Rivals near the kart clear out of the duel and hold station off screen
    for (var r = 0; r < rivals.length; r++) {
        var rv = rivals[r];
        if (rv.ko) continue;
        var d = rv.worldX - kart.worldX;
        if (d > -300 && d < 0)   rv.worldX = kart.worldX - 400;
        if (d >= 0 && d < 1000)  rv.worldX = kart.worldX + 1000 + r * 60;
    }
    toasts.push({ text:'BOSS: ' + def.name.toUpperCase() + ' BLOCKS THE ROAD!', timer:240 });
    if (!hasAchievement('boss_any')) toasts.push({ text:'Jump its brake-check, then stomp or boost-ram it', timer:360 });
    startMusic(5);
}

function bossCooldown() { return Math.max(40, [100, 80, 62][boss.phase] - (gpLevel - 1) * 8); }

function hitBoss() {
    if (!boss || boss.invuln > 0) return;
    boss.hp--;
    boss.invuln   = 40;
    boss.hitFlash = 12;
    shakeFrames = 8; shakeMagnitude = 6;
    spawnSparks(boss.x + boss.w / 2, boss.y + 10);
    playTone(180, 'square', 0.14, 0.12); playTone(120, 'sawtooth', 0.10, 0.2, 0.05);
    boss.phase = boss.hp <= boss.maxHp / 3 ? 2 : boss.hp <= boss.maxHp * 2 / 3 ? 1 : 0;
    if (boss.hp <= 0) defeatBoss();
}

function defeatBoss() {
    for (var i = 0; i < 4; i++) spawnExplosion(boss.x + Math.random() * boss.w, boss.y + Math.random() * boss.h);
    shakeFrames = 20; shakeMagnitude = 9;
    sfxVictory();
    bossDone[boss.idx] = true;
    bossesBeaten++;
    addCorn(50);
    kart.hp = Math.min(kart.maxHp, kart.hp + 25);
    toasts.push({ text:'BOSS DOWN: ' + boss.def.name + '! +50 corn +25 HP', timer:240 });
    unlockAchievement('boss_any');
    if (bossesBeaten >= BOSS_DEFS.length) unlockAchievement('all_bosses');
    boss = null;
    bossShots = [];
    startMusic(BIOMES[currentBiomeIdx].musicIdx);
}

function bossShoot(kind) {
    var b = boss;
    if (kind === 'roll') {
        bossShots.push({ kind:'roll', x:b.x - 10, y:ROAD_Y - 24, w:24, h:24, vx:-(3.5 + b.phase + (gpLevel - 1) * 0.4), rot:0 });
    } else if (kind === 'lob') {
        // Lands in front of the kart, leaving a fire patch to jump
        var tx = randBetween(300, 460), T = 50, g = 0.35;
        var x0 = b.x + 20, y0 = b.y;
        bossShots.push({ kind:'lob', x:x0, y:y0, w:16, h:16, vx:(tx - x0) / T,
                         vy:(ROAD_Y - 8 - y0 - 0.5 * g * T * T) / T, g:g });
    } else if (kind === 'drop') {
        obstacles.push({ type:'barrier', worldX:cameraX + b.x + b.w * 0.3, w:22, h:40, drum:true });
    }
}

function updateBoss() {
    if (!boss) return;
    var b = boss;
    if (b.invuln > 0) b.invuln--;
    if (b.hitFlash > 0) b.hitFlash--;
    b.timer++;

    switch (b.state) {
        case 'intro':
            b.x += (BOSS_HOME_X - b.x) * 0.04;
            if (b.timer > 110) { b.state = 'idle'; b.timer = 0; }
            break;
        case 'idle':
            b.x = BOSS_HOME_X + Math.sin(frameCount * 0.04) * 14;
            if (b.timer > bossCooldown()) {
                var list = b.def.attacks[b.phase];
                b.state = list[b.attackIdx % list.length];
                b.attackIdx++;
                b.timer = 0; b.shots = 0;
            }
            break;
        case 'roll':
        case 'lob':
        case 'drop':
            // Later phases fire a second shot
            if (b.timer === 1 || (b.phase === 2 && b.timer === 32)) bossShoot(b.state);
            if (b.timer > 40) { b.state = 'idle'; b.timer = 0; }
            break;
        case 'brake':
            // 50-frame warning, then slide back under the kart
            if (b.timer > 50) {
                b.x -= 9 + b.phase;
                if (b.x <= KART_SCREEN_X - 24) { b.x = KART_SCREEN_X - 24; b.state = 'dazed'; b.timer = 0; }
            }
            break;
        case 'dazed':
            if (b.timer > 95 - b.phase * 10) { b.state = 'return'; b.timer = 0; }
            break;
        case 'return':
            b.x += 6;
            if (b.x >= BOSS_HOME_X) { b.x = BOSS_HOME_X; b.state = 'idle'; b.timer = 0; }
            break;
    }

    // Projectiles
    for (var i = bossShots.length - 1; i >= 0; i--) {
        var s = bossShots[i];
        s.x += s.vx;
        if (s.kind === 'roll') {
            s.rot += 0.25;
        } else {
            s.vy += s.g; s.y += s.vy;
            if (s.y + s.h >= ROAD_Y) {
                obstacles.push({ type:'patch', kind:'fire', worldX:cameraX + s.x - 22, w:60, h:10 });
                spawnExplosion(s.x + 8, ROAD_Y - 6);
                bossShots.splice(i, 1);
                continue;
            }
        }
        if (s.x + s.w < -40) { bossShots.splice(i, 1); continue; }
        if (overlapsKart(s.x, s.y, s.w, s.h)) {
            if (kart.boostTimer > 0) { spawnExplosion(s.x + s.w / 2, s.y + s.h / 2); bossShots.splice(i, 1); continue; }
            hurtKart(HIT_DAMAGE, s.x + s.w / 2, s.y + s.h / 2);
        }
    }

    // Kart vs boss body
    if (!boss || isDying) return;
    if (!overlapsKart(b.x + 4, b.y, b.w - 8, b.h)) {
        // Boost-ram reaches a boss sitting right in front of the kart
        if (kart.boostTimer > 0 && b.x < KART_SCREEN_X + kart.w + 30 && b.x + b.w > KART_SCREEN_X) hitBoss();
        return;
    }
    var fromAbove = kart.dy > 0 && kart.y + kart.h - kart.dy <= b.y + 8;
    if (fromAbove) {
        if (b.state === 'dazed' || b.state === 'brake') hitBoss();
        kart.y = b.y - kart.h; kart.dy = -9; kart.state = 'air'; kart.airJumps = 0;
        sfxJump();
    } else if (kart.boostTimer > 0) {
        hitBoss();
    } else if (b.state === 'dazed' || b.state === 'return') {
        kart.y = b.y - kart.h; kart.dy = -6; kart.state = 'air';   // climb onto a stunned boss
    } else {
        hurtKart(HIT_DAMAGE, KART_SCREEN_X + kart.w, kart.y + kart.h / 2);
        kart.dy = -8; kart.state = 'air';
    }
}

function overlapsKart(x, y, w, h) {
    return x < KART_SCREEN_X + kart.w - 4 && x + w > KART_SCREEN_X + 4 &&
           y < kart.y + kart.h - 4 && y + h > kart.y + 4;
}

// ==================== BOSS DRAWING ====================
function drawBoss() {
    if (!boss) return;
    var b = boss, x = Math.round(b.x), y = b.y + (b.state === 'idle' ? Math.sin(frameCount * 0.3) : 0);
    ctx.save();
    if (b.invuln > 0 && Math.floor(b.invuln / 4) % 2 === 0) ctx.globalAlpha = 0.55;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(x + 6, ROAD_Y - 3, b.w - 12, 5);
    switch (b.idx) {
        case 0: _drawBossTractor(x, y, b); break;
        case 1: _drawBossBuggy(x, y, b);   break;
        case 2: _drawBossRig(x, y, b);     break;
        case 3: _drawBossPlow(x, y, b);    break;
        case 4: _drawBossCosmos(x, y, b);  break;
    }
    if (b.hitFlash > 0) {
        ctx.globalAlpha = b.hitFlash / 12 * 0.6;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(x, y, b.w, b.h);
    }
    ctx.restore();

    // Brake-check warning: red tail lights and a big "!"
    if (b.state === 'brake' && b.timer <= 50) {
        if (Math.floor(b.timer / 6) % 2 === 0) {
            ctx.fillStyle = '#ff2020';
            ctx.fillRect(x - 2, y + b.h - 26, 6, 10);
            ctx.font = 'bold 34px Courier New';
            ctx.textAlign = 'center';
            ctx.fillStyle = '#ff3030';
            ctx.fillText('!', x + b.w / 2, y - 10);
            ctx.textAlign = 'left';
        }
    }
    // Dazed stars
    if (b.state === 'dazed') {
        for (var i = 0; i < 3; i++) {
            var a = frameCount * 0.12 + i * 2.1;
            ctx.fillStyle = '#ffee44';
            ctx.fillRect(x + b.w / 2 + Math.cos(a) * 26 - 3, y - 12 + Math.sin(a) * 6, 6, 6);
        }
    }
}

function _drawWheel(cx, cy, r) {
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
    ctx.fillStyle = '#3a3a3a';
    ctx.fillRect(cx - r + 3, cy - r + 3, r * 2 - 6, r * 2 - 6);
    ctx.fillStyle = '#888888';
    ctx.fillRect(cx - 3, cy - 3, 6, 6);
}

function _drawBossDriver(x, y, body, eye) {
    ctx.fillStyle = body;
    ctx.fillRect(x, y, 14, 12);
    ctx.fillStyle = eye || '#ff2020';
    ctx.fillRect(x + 8, y + 3, 4, 3);
    ctx.fillStyle = '#000000';
    ctx.fillRect(x + 6, y + 1, 7, 2);               // angry brow
}

function _drawBossTractor(x, y, b) {
    ctx.fillStyle = '#2e7d32';
    ctx.fillRect(x + 24, y + 22, 66, 24);            // body
    ctx.fillStyle = '#43a047';
    ctx.fillRect(x + 24, y + 22, 66, 5);
    ctx.fillStyle = '#1b5e20';
    ctx.fillRect(x + 6, y + 8, 30, 30);              // cab
    ctx.fillStyle = '#90caf9';
    ctx.fillRect(x + 10, y + 12, 22, 14);            // window
    _drawBossDriver(x + 14, y + 14, '#f5c842');
    ctx.fillStyle = '#d4a020';
    ctx.fillRect(x + 10, y + 8, 22, 4);              // straw hat
    ctx.fillStyle = '#555555';
    ctx.fillRect(x + 80, y, 6, 22);                  // exhaust stack
    if (frameCount % 6 === 0) spawnParticle(x + 83, y, 0.5, -1.5, 30, '#666666', 4);
    _drawWheel(x + 22, y + b.h - 18, 18);
    _drawWheel(x + 80, y + b.h - 11, 11);
}

function _drawBossBuggy(x, y, b) {
    ctx.fillStyle = '#c8a050';
    ctx.fillRect(x + 8, y + 26, 80, 12);             // frame
    ctx.fillStyle = '#8a6a30';
    ctx.fillRect(x + 20, y + 4, 4, 24);              // roll bars
    ctx.fillRect(x + 56, y + 4, 4, 24);
    ctx.fillRect(x + 20, y + 4, 40, 4);
    _drawBossDriver(x + 32, y + 12, '#2a2218');
    ctx.fillStyle = '#cc2200';
    ctx.fillRect(x + 36, y + 6, 10, 8);              // vulture head
    ctx.fillStyle = '#ff6600';
    ctx.fillRect(x + 78, y + 18, 10, 8);             // headlight
    _drawWheel(x + 18, y + b.h - 13, 13);
    _drawWheel(x + 74, y + b.h - 13, 13);
}

function _drawBossRig(x, y, b) {
    ctx.fillStyle = '#9e9e9e';
    ctx.fillRect(x, y + 6, 64, 44);                  // trailer
    ctx.fillStyle = '#bdbdbd';
    ctx.fillRect(x, y + 6, 64, 6);
    ctx.fillStyle = '#c62828';
    ctx.fillRect(x + 66, y + 14, 44, 38);            // cab
    ctx.fillStyle = '#e53935';
    ctx.fillRect(x + 66, y + 14, 44, 6);
    ctx.fillStyle = '#90caf9';
    ctx.fillRect(x + 84, y + 20, 20, 14);
    _drawBossDriver(x + 88, y + 22, '#888888', '#ffee00');
    ctx.fillStyle = '#e0e0e0';
    ctx.fillRect(x + 104, y + 38, 8, 10);            // chrome grill
    ctx.fillStyle = '#777777';
    ctx.fillRect(x + 70, y, 5, 16);                  // stack
    _drawWheel(x + 14, y + b.h - 11, 11);
    _drawWheel(x + 42, y + b.h - 11, 11);
    _drawWheel(x + 92, y + b.h - 11, 11);
}

function _drawBossPlow(x, y, b) {
    ctx.fillStyle = '#ef6c00';
    ctx.fillRect(x + 10, y + 20, 70, 26);            // body
    ctx.fillStyle = '#ff9800';
    ctx.fillRect(x + 10, y + 20, 70, 5);
    ctx.fillStyle = '#e65100';
    ctx.fillRect(x + 20, y + 4, 34, 18);             // cab
    ctx.fillStyle = '#b3e5fc';
    ctx.fillRect(x + 24, y + 7, 26, 12);
    _drawBossDriver(x + 30, y + 8, '#e0e8f0');
    ctx.fillStyle = '#9e9e9e';
    ctx.beginPath();                                 // plow blade
    ctx.moveTo(x + 80, y + 18); ctx.lineTo(x + 104, y + 52); ctx.lineTo(x + 80, y + 56);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffeb3b';
    ctx.fillRect(x + 34, y, 6, 4);                   // beacon
    _drawWheel(x + 26, y + b.h - 12, 12);
    _drawWheel(x + 66, y + b.h - 12, 12);
}

function _drawBossCosmos(x, y, b) {
    var glow = 0.4 + 0.3 * Math.sin(frameCount * 0.2);
    ctx.fillStyle = 'rgba(100,255,150,' + glow + ')';
    ctx.fillRect(x + 10, y + b.h - 8, b.w - 20, 6); // hover glow
    ctx.fillStyle = '#9fa8da';
    ctx.fillRect(x + 4, y + 26, 92, 18);             // hull
    ctx.fillStyle = '#c5cae9';
    ctx.fillRect(x, y + 30, 100, 8);
    ctx.fillStyle = 'rgba(120,255,180,0.55)';
    ctx.fillRect(x + 30, y + 4, 40, 24);             // dome
    _drawBossDriver(x + 43, y + 12, '#44cc44', '#ffffff');
    ctx.fillStyle = frameCount % 16 < 8 ? '#ff4444' : '#ffff44';
    for (var i = 0; i < 5; i++) ctx.fillRect(x + 10 + i * 18, y + 32, 5, 4);
}

function drawBossShots() {
    for (var i = 0; i < bossShots.length; i++) {
        var s = bossShots[i];
        ctx.save();
        ctx.translate(s.x + s.w / 2, s.y + s.h / 2);
        if (s.kind === 'roll') {
            ctx.rotate(-s.rot);
            ctx.fillStyle = boss ? boss.def.roll : '#888888';
            ctx.fillRect(-12, -12, 24, 24);
            ctx.fillStyle = 'rgba(0,0,0,0.25)';
            ctx.fillRect(-12, -3, 24, 6);
            ctx.fillRect(-3, -12, 6, 24);
        } else {
            ctx.fillStyle = '#ff6600';
            ctx.fillRect(-8, -8, 16, 16);
            ctx.fillStyle = '#ffee44';
            ctx.fillRect(-4, -4, 8, 8);
            if (frameCount % 2 === 0) spawnParticle(s.x + 8, s.y + 8, 0, -0.5, 12, '#ff8800', 3);
        }

}

function drawBossUI() {
    if (!boss) return;
    var bw = 300, bx = (W - bw) / 2, by = 92;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(bx - 4, by - 16, bw + 8, 30);
    ctx.font = 'bold 11px Courier New';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffcc66';
    ctx.fillText(boss.def.name.toUpperCase(), W / 2, by - 4);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#331111';
    ctx.fillRect(bx, by, bw, 8);
    ctx.fillStyle = boss.phase === 2 ? '#ff3030' : boss.phase === 1 ? '#ff8800' : '#ffcc00';
    ctx.fillRect(bx, by, bw * boss.hp / boss.maxHp, 8);
    for (var i = 1; i < boss.maxHp; i++) {
        ctx.fillStyle = '#000000';
        ctx.fillRect(bx + bw * i / boss.maxHp - 1, by, 2, 8);
    }
}

// ==================== RIVALS ====================
// skill scales a rival's top speed relative to MAX_SPEED
const RIVAL_DEFS = [
    { name:'Mallard Max',   paint:['#2e7d32','#4caf50','#1b4d1e'], driver:'#8a6a4a', skill:0.97 },
    { name:'Goose Gloria',  paint:['#d8d8d8','#ffffff','#888888'], driver:'#eeeeee', skill:0.93 },
    { name:'Swan Svetlana', paint:['#ff77aa','#ffaacc','#aa3366'], driver:'#ffffff', skill:0.95 },
    { name:'Teal Terry',    paint:['#00897b','#26c6da','#004d40'], driver:'#c89820', skill:0.90 },
    { name:'Loon Lars',     paint:['#2a2a2a','#4a4a4a','#000000'], driver:'#666666', skill:0.88 },
    { name:'Pelican Pete',  paint:['#ff9800','#ffb74d','#a65c00'], driver:'#f0e0c0', skill:0.92 },
    { name:'Coot Carla',    paint:['#5c6bc0','#7986cb','#283593'], driver:'#333344', skill:0.99 }
];

function spawnRivals() {
    var defs = shuffleArray(RIVAL_DEFS.slice());
    rivals = defs.map(function(d, i) {
        return { def:d, worldX:kart.worldX + 140 + i * 200, y:ROAD_Y - 32, w:52, h:32, dy:0,
                 state:'ground', ko:false, boostTimer:0, boostCd:300, animFrame:0, rot:0,
                 paint:d.paint, driver:d.driver };
    });
}

function racePosition() {
    var ahead = 0;
    for (var i = 0; i < rivals.length; i++) if (!rivals[i].ko && rivals[i].worldX > kart.worldX) ahead++;
    return ahead + 1;
}

function rivalSpeed(r) {
    var skill = r.def.skill + (gpLevel - 1) * 0.02;
    var ramp  = (BASE_SPEED + (r.worldX - 200) * SPEED_ACCEL) * skill + 0.4;
    var spd   = Math.min(MAX_SPEED * skill, ramp);
    if (r.worldX - kart.worldX > 3000) spd *= 0.93;   // leaders ease off so the pack stays catchable
    return spd;
}

function knockOutRival(r) {
    r.ko = true; r.dy = -8; r.state = 'air'; r.boostTimer = 0;
    rivalsKO++;
    addCorn(10);
    var sx = r.worldX - cameraX;
    spawnExplosion(sx + r.w / 2, r.y + r.h / 2);
    spawnFeathers(sx + 30, r.y + 6);
    sfxKill();
    shakeFrames = 6; shakeMagnitude = 5;
    toasts.push({ text:'KO! ' + r.def.name + ' +10 corn', timer:150 });
    if (rivalsKO >= 3) unlockAchievement('ko_rivals');
}

function updateRivals() {
    for (var i = 0; i < rivals.length; i++) {
        var r = rivals[i];
        if (r.ko) {
            if (r.y < H + 50) { r.dy += GRAVITY; r.y += r.dy; r.rot -= 0.25; r.worldX += 2; }
            continue;
        }

        if (boss) { r.worldX += kartAdvance; continue; }   // the pack holds station during a boss duel

        var spd = rivalSpeed(r);
        if (r.boostTimer > 0) { spd += BOOST_SPEED * 0.8; r.boostTimer--; }
        r.worldX += spd;
        r.animFrame = Math.floor((frameCount + i * 3) / 8) % 4;

        // Hop barriers just ahead
        if (r.state === 'ground') {
            for (var oi = 0; oi < obstacles.length; oi++) {
                var o = obstacles[oi];
                var ahead = o.worldX - (r.worldX + r.w);
                if (o.type === 'barrier' && !o.smashed && ahead > 0 && ahead < 8 + spd * 4) {
                    r.dy = -9; r.state = 'air'; break;
                }
            }
        }
        r.dy += GRAVITY;
        r.y  += r.dy;
        if (r.y >= ROAD_Y - r.h) { r.y = ROAD_Y - r.h; r.dy = 0; r.state = 'ground'; }

        // A rival close behind will try to boost-ram past you
        var behind = kart.worldX - r.worldX;
        if (r.boostCd > 0) r.boostCd--;
        else if (behind > 40 && behind < 260 && Math.random() < 0.012) {
            r.boostTimer = 30; r.boostCd = 600;
            toasts.push({ text:r.def.name + ' is boosting up behind you!', timer:90 });
            playTone(200, 'sawtooth', 0.08, 0.3);
        }

        // Contact with the player
        if (isDying || !kart.alive) continue;
        var hitX = r.worldX < kart.worldX + kart.w - 8 && r.worldX + r.w - 8 > kart.worldX;
        var hitY = r.y < kart.y + kart.h - 6 && r.y + r.h - 6 > kart.y;
        if (!hitX || !hitY) continue;
        var stomp = kart.dy > 1.5 && kart.y + kart.h <= r.y + 14;
        if (kart.boostTimer > 0 || stomp) {
            knockOutRival(r);
            if (stomp) { kart.dy = -6; kart.state = 'air'; }
        } else if (r.boostTimer > 0) {
            hurtKart(15, r.worldX - cameraX + r.w, r.y + 16);
            r.boostTimer = 0;
        }
    }
}

function drawRivals() {
    var nearest = null;
    for (var i = 0; i < rivals.length; i++) {
        var r  = rivals[i];
        var sx = r.worldX - cameraX;
        if (r.ko && r.y >= H + 50) continue;
        if (sx > W && !r.ko && (!nearest || r.worldX < nearest.worldX)) nearest = r;
        if (sx + r.w < -20 || sx > W + 20) continue;
        if (r.boostTimer > 0 && frameCount % 2 === 0) spawnBoostFX(sx - 4, r.y + r.h - 8);
        drawKart(r, sx, r.y);
        if (!r.ko) {
            ctx.font = 'bold 10px Courier New';
            ctx.textAlign = 'center';
            ctx.fillStyle = '#000000';
            ctx.fillText(r.def.name, sx + 27, r.y - 7);
            ctx.fillStyle = r.def.paint[1];
            ctx.fillText(r.def.name, sx + 26, r.y - 8);
            ctx.textAlign = 'left';
        }
    }
    // Arrow to the next rival ahead when it's off screen
    if (nearest && nearest.worldX - kart.worldX < 2500) {
        var m = Math.round((nearest.worldX - kart.worldX) / 10);
        var label = nearest.def.name + ' ' + m + 'm \u25B6';
        ctx.font = 'bold 11px Courier New';
        ctx.textAlign = 'right';
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(W - ctx.measureText(label).width - 16, ROAD_Y - 78, ctx.measureText(label).width + 12, 18);
        ctx.fillStyle = nearest.def.paint[1];
        ctx.fillText(label, W - 10, ROAD_Y - 65);
        ctx.textAlign = 'left';
    }
}

function drawCountdown() {
    if (countdown <= 0 && countdown > -40) { countdown--; }
    if (countdown <= -40 || gameState !== 'PLAYING') return;
    var label = countdown > 0 ? String(Math.ceil(countdown / 60)) : 'GO!';
    ctx.textAlign = 'center';
    ctx.font = 'bold 90px Courier New';
    ctx.fillStyle = '#000000';
    ctx.fillText(label, W / 2 + 4, 224);
    ctx.fillStyle = countdown > 0 ? '#ffcc00' : '#44ff88';
    ctx.fillText(label, W / 2, 220);
    ctx.textAlign = 'left';
}

// ==================== HUD ====================
function updateHUD() {
    var pct  = Math.max(0, kart.hp / kart.maxHp * 100);
    var hpEl = document.getElementById('hpBarInner');
    hpEl.style.width      = pct + '%';
    hpEl.style.background = pct > 60 ? '#2ecc71' : pct > 30 ? '#f1c40f' : '#e74c3c';

    var n = kart.boostCharges, boosts = '';
    if (n > 5) boosts = '\u26A1 x' + n;
    else for (var i = 0; i < n; i++) boosts += '\u26A1';
    if (kart.boostTimer > 0) boosts += ' \u25BA';
    document.getElementById('boostDisplay').textContent    = 'BOOST ' + (boosts || '0');
    document.getElementById('distanceDisplay').textContent = distMeters() + 'm';
    document.getElementById('biomeDisplay').textContent    = zoneLabel();
    document.getElementById('cornDisplay').textContent     = '\uD83C\uDF3D ' + corn;
    document.getElementById('killDisplay').textContent     = '\uD83D\uDC80 ' + kills;
    var pos = racePosition();
    var posEl = document.getElementById('posDisplay');
    posEl.textContent = 'POS ' + pos + ' / ' + (RIVAL_DEFS.length + 1);
    posEl.style.color = pos === 1 ? '#ffd700' : pos <= 3 ? '#ffcc66' : '#ff8866';

    updateUpgradeChips();
}

var hudChipKey = null;

function updateUpgradeChips() {
    var chips = [];
    if (kart.tough) chips.push({ id:'tough', label:'TOUGH', color:'#b8c2cc' });
    for (var ui = 0; ui < activeUpgrades.length; ui++) {
        var def = upgradeDef(activeUpgrades[ui]);
        if (def) chips.push({ id:def.id, label:def.short, color:def.color,
                              spent: def.id === 'roll_cage' && !kart.shield });
    }

    // updateHUD runs every frame, so only touch the DOM when the set changes
    var key = chips.map(function(c) { return c.id + (c.spent ? '*' : ''); }).join(',');
    if (key === hudChipKey) return;
    hudChipKey = key;

    var box = document.getElementById('upgradeIcons');
    while (box.firstChild) box.removeChild(box.firstChild);
    for (var ci = 0; ci < chips.length; ci++) {
        var c  = chips[ci];
        var el = document.createElement('span');
        el.className = 'chip' + (c.spent ? ' spent' : '');
        el.style.borderColor = c.color;
        var img = document.createElement('img');
        img.src = ICON_URLS[c.id];
        img.alt = '';
        el.appendChild(img);
        el.appendChild(document.createTextNode(c.label));
        box.appendChild(el);
    }
}

function upgradeDef(id) {
    for (var i = 0; i < UPGRADE_DEFS.length; i++) if (UPGRADE_DEFS[i].id === id) return UPGRADE_DEFS[i];
    return null;
}

// ==================== BIOME TRANSITION ====================
function checkBiomeTransition() {
    if (boss) return;   // the boss guards the way to the next biome
    var newIdx = 0;
    for (var i = BIOMES.length - 1; i >= 0; i--) {
        if (distancePx >= BIOMES[i].startDist) { newIdx = i; break; }
    }
    if (newIdx !== currentBiomeIdx) {
        currentBiomeIdx = newIdx;
        sfxBiome();
        startMusic(BIOMES[newIdx].musicIdx);
        var map = { 1:'reach_desert', 2:'reach_city', 3:'reach_mountain', 4:'reach_space' };
        if (map[newIdx]) unlockAchievement(map[newIdx]);
        toasts.push({ text:'Entering: ' + BIOMES[newIdx].name, timer:200 });
        if (BIOMES[newIdx].hazardTip) toasts.push({ text:BIOMES[newIdx].hazardTip, timer:300 });
        biomeFlash = 30;
        nextEnemyX = kart.worldX + 600; // safe zone after transition
    }
}

// ==================== ACHIEVEMENTS ====================
const MILESTONE_LABELS = ['500m','1km','2km','3km','4km','5km','6km','7km'];
function checkAchievements() {
    if (distMeters() >= 500)  unlockAchievement('dist_500');
    if (distMeters() >= 2000) unlockAchievement('dist_2000');
    if (kills >= 10)          unlockAchievement('kills_10');
    if (upgradesTaken >= 3)   unlockAchievement('upgrade_3');
    if (noHitRun && distMeters() >= 500) unlockAchievement('no_hit_500');

    // Distance milestone toasts
    while (nextMilestoneIdx < DIST_MILESTONES.length &&
           distMeters() >= DIST_MILESTONES[nextMilestoneIdx]) {
        toasts.push({ text: MILESTONE_LABELS[nextMilestoneIdx] + ' — Keep going!', timer: 160 });
        nextMilestoneIdx++;
    }

    if (distancePx >= VICTORY_DIST && !boss) {
        if (gameState === 'PLAYING') {
            unlockAchievement('victory');
            if (gpLevel >= 3) unlockAchievement('gp_3');
            if (gpLevel === meta.gpUnlocked && gpLevel < MAX_GP) {
                meta.gpUnlocked++;
                saveMeta();
                toasts.push({ text:'GRAND PRIX ' + meta.gpUnlocked + ' UNLOCKED!', timer:300 });
            }
            finishPos = racePosition();
            if (finishPos <= 3) unlockAchievement('podium');
            if (finishPos === 1) unlockAchievement('champion');
            stopMusic();
            sfxVictory();
            recordRun();
            gameState = 'VICTORY';
            victoryInputLock = 180; // ~3 seconds before restart is accepted
            document.getElementById('hud').style.display = 'none';
        }
    }
}

// ==================== PHYSICS ====================
var isDying = false;

// The single place damage is applied. fxX/fxY (screen space) place the impact sparks.
function hurtKart(amount, fxX, fxY) {
    if (kart.invincible > 0 || kart.boostTimer > 0 || !kart.alive || isDying) return false;
    if (fxX !== undefined) spawnSparks(fxX, fxY);
    spawnFeathers(KART_SCREEN_X + 26, kart.y + 14);
    if (kart.shield) {
        kart.shield     = false;
        kart.invincible = 50;
        shakeFrames = 5; shakeMagnitude = 4;
        return true;
    }
    if (kart.tough) amount = Math.round(amount * 0.6);
    kart.hp        -= amount;
    kart.invincible = HIT_INV_FRAMES;
    kart.dy         = Math.min(kart.dy, -2);
    shakeFrames = 10; shakeMagnitude = 7;
    sfxHit();
    noHitRun = false;
    if (kart.hp <= 0) { kart.hp = 0; kart.alive = false; }
    return true;
}

function updatePhysics() {
    if (isDying) {
        if (--deathTimer <= 0) gameOver();
        return;
    }
    if (countdown > 0) {
        if (countdown % 60 === 0) playTone(countdown === 60 ? 660 : 440, 'square', 0.10, 0.15);
        if (--countdown === 0) playTone(880, 'square', 0.12, 0.3);
        updateHUD();
        return;
    }
    runFrames++;

    // Biome hazard under the kart (sand/oil/ice act on the wheels, zero-G on the whole column)
    var patch = patchUnderKart();
    kart.surface = patch && patch.kind !== 'fire' && (patch.kind === 'lowg' || kart.state === 'ground') ? patch.kind : null;
    if (kart.surface === 'oil' && !patch.used) {
        patch.used = true;
        kart.spin  = 40;
        toasts.push({ text:'SPUN OUT!', timer:90 });
        playTone(300, 'sawtooth', 0.08, 0.25);
    }
    if (kart.spin > 0) kart.spin--;
    if (patch && patch.kind === 'fire' && kart.y + kart.h > ROAD_Y - 18)
        hurtKart(20, KART_SCREEN_X + kart.w / 2, ROAD_Y - 6);
    var surfMul = kart.surface === 'sand' ? 0.6 : kart.surface === 'ice' ? 1.35 : 1;
    if (kart.surface === 'sand' && frameCount % 3 === 0) spawnDust(KART_SCREEN_X + 8, ROAD_Y - 2);
    if (kart.surface === 'ice' && frameCount % 4 === 0)
        spawnParticle(KART_SCREEN_X + 10, ROAD_Y - 2, -2, -1, 14, '#e8f8ff', 2);

    // Speed ramp-up over distance
    var maxSpd = MAX_SPEED + (activeUpgrades.indexOf('turbo_engine') !== -1 ? 0.6 : 0);
    kart.speed = Math.min(maxSpd,
        BASE_SPEED + (kart.swiftMode ? 0.8 : 0) + distancePx * SPEED_ACCEL);

    // Active boost adds extra speed for boostTimer frames
    kartAdvance = kart.speed * surfMul;
    if (kart.boostTimer > 0) {
        kartAdvance += BOOST_SPEED + (activeUpgrades.indexOf('rocket_boost') !== -1 ? 2 : 0);
        kart.boostTimer--;
        if (frameCount % 2 === 0) spawnBoostFX(KART_SCREEN_X - 4, kart.y + kart.h - 6);
    }

    // Advance kart (course distance stands still while a boss blocks the road)
    kart.worldX += kartAdvance;
    if (boss) bossPx += kartAdvance;
    distancePx   = Math.max(0, kart.worldX - 200 - bossPx);
    cameraX      = kart.worldX - KART_SCREEN_X;

    // Gravity
    var effG = kart.swiftMode ? GRAVITY * 0.85 : GRAVITY;
    if (kart.surface === 'lowg') effG *= 0.35;
    kart.dy += effG;
    if (kart.dy > MAX_FALL) kart.dy = MAX_FALL;
    kart.y += kart.dy;

    // Road floor collision
    if (kart.y + kart.h >= ROAD_Y) {
        if (kart.state === 'air') {
            if (kart.dy > 2) { sfxLand(); spawnDust(KART_SCREEN_X + kart.w / 2, ROAD_Y); }
            landKart();
        }
        kart.y     = ROAD_Y - kart.h;
        kart.dy    = 0;
        kart.state = 'ground';
        kart.airJumps = 0;
    }

    // Passive HP regen while on ground
    if (kart.state === 'ground' && kart.hp < kart.maxHp) {
        hpRegenTimer++;
        if (hpRegenTimer >= HP_REGEN_INTERVAL) {
            hpRegenTimer = 0;
            kart.hp = Math.min(kart.maxHp, kart.hp + HP_REGEN_AMOUNT);
            sfxHpRegen();
        }
    } else if (kart.state !== 'ground') {
        hpRegenTimer = 0;
    }

    // Backflips: hold the trick key in the air; a started flip always finishes its turn
    if (kart.state === 'air' && (trickHeld || kart.flipRot > 0)) {
        kart.flipRot += Math.PI * 2 / FLIP_FRAMES;
        if (kart.flipRot >= Math.PI * 2) {
            kart.flips++;
            kart.flipRot = trickHeld ? kart.flipRot - Math.PI * 2 : 0;
            playTone(500 + kart.flips * 120, 'square', 0.06, 0.06);
        }
    }

    // ── Obstacle collision ──
    checkObstacleCollisions();
    if (!kart.onRamp) kart.tilt *= 0.9;
    kart.rot = kart.tilt - kart.flipRot + (kart.spin > 0 ? Math.sin(kart.spin * 0.7) * 0.35 : 0);

    // Canvas top clamp
    if (kart.y < 0) { kart.y = 0; kart.dy = Math.max(0, kart.dy); }

    // Invincibility tick
    if (kart.invincible > 0) kart.invincible--;

    // Rocket flame while airborne or boosting
    if ((kart.state === 'air' || kart.boostTimer > 0) && frameCount % 2 === 0) {
        spawnRocketFlame(KART_SCREEN_X - 2, kart.y + kart.h - 6);
    }

    // Tire dust while on ground
    if (kart.state === 'ground' && frameCount % 5 === 0) {
        spawnDust(KART_SCREEN_X + 6, ROAD_Y - 2);
    }

    // Roll Cage recharges every SHIELD_RECHARGE_PX after it breaks
    if (!kart.shield && activeUpgrades.indexOf('roll_cage') !== -1) {
        if (shieldBrokenAt < 0) shieldBrokenAt = distancePx;
        if (distancePx - shieldBrokenAt >= SHIELD_RECHARGE_PX) {
            kart.shield = true; shieldBrokenAt = -1;
            toasts.push({ text:'Roll Cage recharged', timer:120 });
        }
    }

    // Death check
    if (kart.hp <= 0 || !kart.alive) {
        kart.hp = 0; kart.alive = false; isDying = true; deathTimer = 55;
        sfxDie(); stopMusic();
        spawnExplosion(KART_SCREEN_X + kart.w / 2, kart.y + kart.h / 2);
        return;
    }

    // Kart animation
    kart.animTimer++;
    if (kart.animTimer >= 8) { kart.animTimer = 0; kart.animFrame = (kart.animFrame + 1) % 4; }

    // Systems
    checkBossTrigger();
    checkBiomeTransition();
    if (distancePx - lastUpgradePx >= UPGRADE_EVERY_PX) {
        lastUpgradePx += UPGRADE_EVERY_PX;
        triggerUpgrade();
    }
    checkAchievements();
    updateHUD();
}

function patchUnderKart() {
    for (var i = 0; i < obstacles.length; i++) {
        var o = obstacles[i];
        if (o.type === 'patch' && kart.worldX + kart.w - 6 > o.worldX && kart.worldX + 6 < o.worldX + o.w) return o;
    }
    return null;
}

function landKart() {
    var r = kart.flipRot;
    var n = kart.flips + (r > Math.PI * 2 - 0.5 ? 1 : 0);   // a nearly finished flip still counts
    if (r > 0.5 && r < Math.PI * 2 - 0.5) {
        if (activeUpgrades.indexOf('big_wheels') !== -1) {
            toasts.push({ text:'SAVED BY MONSTER WHEELS', timer:120 });
        } else if (hurtKart(BAD_LANDING_DAMAGE, KART_SCREEN_X + kart.w / 2, ROAD_Y - 4)) {
            toasts.push({ text:'BAD LANDING!', timer:120 });
        }
    } else if (n > 0) {
        var gain = Math.round(TRICK_CORN * n * (activeUpgrades.indexOf('big_wheels') !== -1 ? 1.5 : 1));
        var names = ['', 'BACKFLIP', 'DOUBLE FLIP', 'TRIPLE FLIP'];
        var text = (names[n] || n + 'x FLIP') + '! +' + gain + ' corn';
        addCorn(gain);
        if (n >= 2) {
            kart.boostCharges++;
            text += ' +BOOST';
            unlockAchievement('trick_2');
        }
        toasts.push({ text:text, timer:140 });
        sfxCollect();
        spawnCollectFX(KART_SCREEN_X + kart.w / 2, kart.y);
    }
    kart.flipRot = 0;
    kart.flips   = 0;
}

function addCorn(n) {
    cornFrac += n * (1 + 0.25 * garageLevel('scoop')) * (1 + (gpLevel - 1) * 0.2);
    var whole = Math.floor(cornFrac);
    corn += whole;
    cornFrac -= whole;
}

// ==================== RUN MANAGEMENT ====================
function startRun() {
    kart.worldX = 200; kart.y = ROAD_Y - kart.h; kart.dy = 0;
    kart.speed = BASE_SPEED; kart.state = 'ground';
    kart.maxHp = 100 + 10 * garageLevel('chassis'); kart.hp = kart.maxHp;
    kart.boostCharges = 1 + garageLevel('nitro'); kart.boostTimer = 0;
    kart.animFrame = 0; kart.animTimer = 0; kart.invincible = 0;
    kart.shield = false; kart.airJumps = 0; kart.maxAirJumps = 0;
    kart.alive = true; kart.swiftMode = false; kart.tough = false; kart.paint = ABILITY_POOL[0].paint;
    kart.flipRot = 0; kart.flips = 0; kart.tilt = 0; kart.rot = 0; kart.onRamp = null;
    kart.surface = null; kart.spin = 0;
    trickHeld = false;

    corn = 0; cornFrac = 0; rerollCost = 15; kills = 0; distancePx = 0;
    currentBiomeIdx = 0; lastUpgradePx = 0;
    activeUpgrades = []; noHitRun = true; upgradesTaken = 0; shieldBrokenAt = -1;
    rivalsKO = 0; finishPos = 0; countdown = 180;
    boss = null; bossShots = []; bossDone = [false, false, false, false, false]; bossesBeaten = 0; bossPx = 0;
    toasts = []; shakeFrames = 0; shakeMagnitude = 0;
    isDying = false; runFrames = 0; deathTimer = 0; frameCount = 0;
    biomeFlash = 0; nextMilestoneIdx = 0; hpRegenTimer = 0; lastVictoryFirework = 0; victoryInputLock = 0;

    obstacles = []; enemies = []; collectibles = [];
    particles = []; bgParticles = [];

    nextObstacleX    = 500;
    nextEnemyX       = kart.worldX + 800;
    nextCollectibleX = kart.worldX + 400;

    cameraX = kart.worldX - KART_SCREEN_X;
    spawnRivals();
    startMusic(0);
    if (meta.totalRuns < 3) toasts.push({ text:'Hold \u2193 in the air to flip!', timer:300 });
    gameState = 'PLAYING';
    document.getElementById('hud').style.display = 'flex';
    updateHUD();
}

function recordRun() {
    unlockAchievement('first_run');
    meta.cornBank += corn;
    newBest = distancePx > meta.bestDistance;
    if (newBest) meta.bestDistance = distancePx;
    meta.totalRuns++;
    saveMeta();
}

function gameOver() {
    if (gameState !== 'PLAYING') return;
    stopMusic();
    recordRun();
    gameState = 'DEAD';
    document.getElementById('hud').style.display = 'none';
}

// ==================== UPGRADE SELECTION ====================
function upgradePool() {
    return shuffleArray(UPGRADE_DEFS.filter(function(u) {
        if (u.id === 'roll_cage') return !kart.shield;
        return u.stack || activeUpgrades.indexOf(u.id) === -1;
    }));
}

function triggerUpgrade() {
    upgradeChoices  = upgradePool().slice(0, 3);
    freeReroll      = garageLevel('crew') > 0;
    gameState       = 'UPGRADE';
    document.getElementById('hud').style.display = 'none';
}

function applyUpgrade(idx) {
    var up = upgradeChoices[idx];
    if (!up) return;
    switch (up.id) {
        case 'double_jump': kart.maxAirJumps = 1;                                             break;
        case 'roll_cage':   kart.shield = true; shieldBrokenAt = -1;                           break;
        case 'extra_boost': kart.boostCharges++;                                               break;
        case 'hp_up':       kart.maxHp += 25; kart.hp = Math.min(kart.maxHp, kart.hp + 25); break;
    }
    if (activeUpgrades.indexOf(up.id) === -1) activeUpgrades.push(up.id);
    upgradesTaken++;
    sfxUpgrade();
    checkAchievements();
    gameState = 'PLAYING';
    document.getElementById('hud').style.display = 'flex';
    updateHUD();
}

function repairCost() { return garageLevel('crew') > 0 ? 12 : 20; }

function rerollUpgrades() {
    if (!freeReroll && corn < rerollCost) return;
    if (freeReroll) freeReroll = false;
    else { corn -= rerollCost; rerollCost += 10; }
    // Fresh cards first, topped up from the current ones if the pool runs short
    var pool  = upgradePool();
    var fresh = pool.filter(function(u) { return upgradeChoices.indexOf(u) === -1; });
    upgradeChoices = fresh.concat(pool.filter(function(u) { return fresh.indexOf(u) === -1; })).slice(0, 3);
    sfxCollect();
}

function repairKart() {
    if (corn < repairCost() || kart.hp >= kart.maxHp) return;
    corn -= repairCost();
    kart.hp = Math.min(kart.maxHp, kart.hp + 40);
    sfxHpRegen();
}

// ==================== ABILITY SELECTION ====================
function selectAbility(idx) {
    if (!abilityChoices[idx]) return;
    startRun();
    abilityChoices[idx].apply();
    kart.paint = abilityChoices[idx].paint;
    updateHUD();
}

// ==================== INPUT ACTIONS ====================
function doJump() {
    if (kart.spin > 0) return;   // spun out on an oil slick
    kart.onRamp = null;
    if (kart.state === 'ground') {
        kart.dy = JUMP_POWER * (kart.surface === 'ice' ? 0.7 : 1); kart.state = 'air'; kart.airJumps = 0;
        sfxJump();
        spawnDust(KART_SCREEN_X + kart.w / 2, ROAD_Y);
        spawnRocketFlame(KART_SCREEN_X - 4, kart.y + kart.h - 4);
    } else if (kart.airJumps < kart.maxAirJumps) {
        kart.dy = JUMP_POWER * 0.85; kart.airJumps++;
        sfxJump();
        spawnRocketFlame(KART_SCREEN_X - 4, kart.y + kart.h - 4);
    }
}

function doBoost() {
    if (kart.boostCharges > 0) {
        var dur = activeUpgrades.indexOf('rocket_boost') !== -1 ? 30 : 20;
        kart.boostTimer = dur;
        kart.boostCharges--;
        sfxBoost();
        spawnBoostFX(KART_SCREEN_X - 6, kart.y + kart.h / 2);
        if (activeUpgrades.indexOf('exhaust_fire') !== -1) exhaustBlast();
        updateHUD();
    }
}

function exhaustBlast() {
    var cx = kart.worldX + kart.w / 2, cy = kart.y + kart.h / 2;
    for (var i = 0; i < enemies.length; i++) {
        var e = enemies[i];
        var dx = e.worldX + e.w / 2 - cx, dy = e.y + e.h / 2 - cy;
        if (dx * dx + dy * dy < EXHAUST_RADIUS * EXHAUST_RADIUS) e.hp = 0;
    }
    for (var a = 0; a < 16; a++) {
        var ang = a / 16 * Math.PI * 2;
        spawnParticle(KART_SCREEN_X + kart.w / 2, cy, Math.cos(ang) * 6, Math.sin(ang) * 6,
            20, a % 2 ? '#ff6600' : '#ffcc00', 4);
    }
    shakeFrames = 6; shakeMagnitude = 4;
}

// ==================== DRAW: BACKGROUNDS (parallax per biome) ====================
function drawBackground() {
    var b = BIOMES[currentBiomeIdx];

    // Sky gradient
    var grd = ctx.createLinearGradient(0, 0, 0, ROAD_Y);
    grd.addColorStop(0, b.skyTop);
    grd.addColorStop(1, b.skyBot);
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, ROAD_Y);

    ctx.save();
    switch (currentBiomeIdx) {
        case 0: drawBgCountryRoad(); break;
        case 1: drawBgDesert();      break;
        case 2: drawBgCity();        break;
        case 3: drawBgMountain();    break;
        case 4: drawBgSpace();       break;
    }
    ctx.restore();
}

function drawBgCountryRoad() {
    // Layer 1 (0.10x): fluffy clouds
    ctx.fillStyle = 'rgba(255,255,255,0.80)';
    for (var c = 0; c < 5; c++) {
        var cx = ((c * 320 - cameraX * 0.10) % (W + 350) + W + 350) % (W + 350) - 150;
        var cy = 28 + (c % 3) * 24;
        ctx.fillRect(cx,      cy,      110 + c*10, 24);
        ctx.fillRect(cx + 20, cy - 16, 65,         18);
        ctx.fillRect(cx + 60, cy - 10, 40,         14);
    }
    // Layer 2 (0.20x): rolling hills
    ctx.fillStyle = '#4a7a28';
    var hOff = (-(cameraX * 0.20)) % W;
    var hpts = [[0,260],[100,200],[240,230],[380,180],[520,220],[660,170],[800,210],[940,260]];
    ctx.beginPath();
    ctx.moveTo(hOff, ROAD_Y);
    for (var h = 0; h < hpts.length; h++) ctx.lineTo(hOff + hpts[h][0], hpts[h][1]);
    ctx.lineTo(hOff + W, ROAD_Y); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(hOff + W, ROAD_Y);
    for (var h2 = 0; h2 < hpts.length; h2++) ctx.lineTo(hOff + W + hpts[h2][0], hpts[h2][1]);
    ctx.lineTo(hOff + W*2, ROAD_Y); ctx.closePath(); ctx.fill();
    // Layer 3 (0.45x): roadside fence posts
    ctx.fillStyle = '#7a5520';
    for (var f = 0; f < 12; f++) {
        var fx = ((f * 80 - cameraX * 0.45) % (W + 100) + W + 100) % (W + 100) - 20;
        ctx.fillRect(fx, ROAD_Y - 40, 6, 38);
        if (f % 2 === 0) {
            ctx.fillStyle = '#9a7a40';
            ctx.fillRect(fx - 2, ROAD_Y - 24, 82, 5);
            ctx.fillStyle = '#7a5520';
        }
    }
}

function drawBgDesert() {
    // Layer 1 (0.06x): distant mountains
    ctx.fillStyle = '#c07840';
    var mOff = (-(cameraX * 0.06)) % W;
    ctx.beginPath();
    ctx.moveTo(mOff, ROAD_Y);
    var mpts = [[0,310],[90,240],[200,280],[320,210],[450,260],[580,200],[720,250],[860,310]];
    for (var m = 0; m < mpts.length; m++) ctx.lineTo(mOff + mpts[m][0], mpts[m][1]);
    ctx.lineTo(mOff + W, ROAD_Y); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(mOff + W, ROAD_Y);
    for (var m2 = 0; m2 < mpts.length; m2++) ctx.lineTo(mOff + W + mpts[m2][0], mpts[m2][1]);
    ctx.lineTo(mOff + W*2, ROAD_Y); ctx.closePath(); ctx.fill();
    // Layer 2 (0.20x): sand dunes
    ctx.fillStyle = '#d4b060';
    for (var d = 0; d < 5; d++) {
        var dx = ((d * 200 - cameraX * 0.20) % (W + 250) + W + 250) % (W + 250) - 80;
        ctx.beginPath();
        ctx.arc(dx + 100, ROAD_Y, 100, Math.PI, 0);
        ctx.fill();
    }
    // Layer 3 (0.50x): cacti
    ctx.fillStyle = '#3a7a30';
    for (var k = 0; k < 7; k++) {
        var kx = ((k * 140 - cameraX * 0.50) % (W + 160) + W + 160) % (W + 160) - 20;
        ctx.fillRect(kx,      ROAD_Y - 55, 10, 52);    // trunk
        ctx.fillRect(kx - 16, ROAD_Y - 36, 16, 8);     // left arm
        ctx.fillRect(kx - 16, ROAD_Y - 46, 8,  16);
        ctx.fillRect(kx + 10, ROAD_Y - 30, 16, 8);     // right arm
        ctx.fillRect(kx + 16, ROAD_Y - 40, 8,  16);
    }
    // Heat shimmer line
    ctx.fillStyle = 'rgba(255,230,160,0.18)';
    ctx.fillRect(0, ROAD_Y - 12, W, 8);
}

function drawBgCity() {
    // Layer 1 (0.15x): distant skyline
    var skOff = (-(cameraX * 0.15)) % W;
    var buildings = [[0,160,55],[60,100,45],[110,180,60],[175,120,50],[230,140,70],[305,90,40],
                     [350,170,55],[410,110,65],[480,150,50],[535,130,45],[585,160,70],[660,100,55]];
    // Two copies, one screen width apart; windows lit by a fixed per-building pattern
    for (var copy = 0; copy < 2; copy++) {
        for (var bi = 0; bi < buildings.length; bi++) {
            var bx = skOff + copy * W + buildings[bi][0], by = buildings[bi][1], bw = buildings[bi][2];
            ctx.fillStyle = '#1a2238';
            ctx.fillRect(bx, by, bw, ROAD_Y - by);
            ctx.fillStyle = 'rgba(255,240,100,0.25)';
            for (var wy = 10; by + wy < ROAD_Y - 10; wy += 18) {
                for (var wx = 6; wx < bw - 6; wx += 12) {
                    if (((wx + wy + bi * 5) % 7) > 2) ctx.fillRect(bx + wx, by + wy, 7, 9);
                }
            }
        }
    }
    // Layer 2 (0.55x): streetlights
    ctx.fillStyle = '#888890';
    for (var sl = 0; sl < 8; sl++) {
        var slx = ((sl * 110 - cameraX * 0.55) % (W + 130) + W + 130) % (W + 130) - 20;
        ctx.fillRect(slx + 2, ROAD_Y - 80, 5, 78);
        ctx.fillRect(slx - 8,  ROAD_Y - 80, 22, 5);
        // Light glow
        ctx.fillStyle = 'rgba(255,240,160,0.30)';
        ctx.fillRect(slx - 14, ROAD_Y - 78, 34, 18);
        ctx.fillStyle = '#888890';
    }
    // Rain puddle reflections
    ctx.fillStyle = 'rgba(100,140,200,0.22)';
    for (var pr = 0; pr < 6; pr++) {
        var prx = ((pr * 130 - cameraX * 0.80) % (W + 150) + W + 150) % (W + 150) - 30;
        ctx.fillRect(prx, ROAD_Y - 4, 50, 4);
    }
}

function drawBgMountain() {
    // Layer 1 (0.10x): distant snow peaks
    ctx.fillStyle = '#d0d8e8';
    var mpOff = (-(cameraX * 0.10)) % W;
    var mPeaks = [[0,320],[80,200],[180,260],[300,160],[420,220],[550,150],[680,200],[800,320]];
    ctx.beginPath();
    ctx.moveTo(mpOff, ROAD_Y);
    for (var mp = 0; mp < mPeaks.length; mp++) ctx.lineTo(mpOff + mPeaks[mp][0], mPeaks[mp][1]);
    ctx.lineTo(mpOff + W, ROAD_Y); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(mpOff + W, ROAD_Y);
    for (var mp2 = 0; mp2 < mPeaks.length; mp2++) ctx.lineTo(mpOff + W + mPeaks[mp2][0], mPeaks[mp2][1]);
    ctx.lineTo(mpOff + W*2, ROAD_Y); ctx.closePath(); ctx.fill();
    // Snow caps
    ctx.fillStyle = '#ffffff';
    var cappts = [[80,200],[300,160],[550,150],[680,200]];
    for (var cp = 0; cp < cappts.length * 2; cp++) {
        var cpx = mpOff + (cp >= cappts.length ? W : 0) + cappts[cp % cappts.length][0];
        var cpy = cappts[cp % cappts.length][1];
        ctx.beginPath();
        ctx.moveTo(cpx - 30, cpy + 40); ctx.lineTo(cpx, cpy); ctx.lineTo(cpx + 30, cpy + 40);
        ctx.closePath(); ctx.fill();
    }
    // Layer 2 (0.28x): pine trees
    ctx.fillStyle = '#1a4a20';
    for (var pt = 0; pt < 9; pt++) {
        var ptx = ((pt * 90 - cameraX * 0.28) % (W + 110) + W + 110) % (W + 110) - 20;
        // Three stacked triangles = pine silhouette
        ctx.beginPath();
        ctx.moveTo(ptx + 20, ROAD_Y - 80); ctx.lineTo(ptx, ROAD_Y - 40); ctx.lineTo(ptx + 40, ROAD_Y - 40);
        ctx.closePath(); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(ptx + 20, ROAD_Y - 60); ctx.lineTo(ptx - 8, ROAD_Y - 18); ctx.lineTo(ptx + 48, ROAD_Y - 18);
        ctx.closePath(); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(ptx + 20, ROAD_Y - 38); ctx.lineTo(ptx - 16, ROAD_Y); ctx.lineTo(ptx + 56, ROAD_Y);
        ctx.closePath(); ctx.fill();
    }
    // Snow on shoulder
    ctx.fillStyle = 'rgba(230,240,255,0.55)';
    ctx.fillRect(0, ROAD_Y - 9, W, 9);
}

function drawBgSpace() {
    // Stars (static, 0.03x parallax)
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (var s = 0; s < 70; s++) {
        var sx = ((s * 179 - cameraX * 0.03) % W + W) % W;
        var sy = (s * 101) % (H * 0.78);
        ctx.fillRect(sx, sy, s % 5 === 0 ? 2 : 1, s % 5 === 0 ? 2 : 1);
    }
    // Layer 1 (0.08x): colorful nebula smears
    var nebColors = ['rgba(80,20,120,0.14)','rgba(20,60,140,0.12)','rgba(140,20,60,0.10)'];
    for (var nb = 0; nb < 3; nb++) {
        var nbx = ((nb * 340 - cameraX * 0.08) % (W + 400) + W + 400) % (W + 400) - 150;
        ctx.fillStyle = nebColors[nb % nebColors.length];
        ctx.fillRect(nbx, 20, 260, 180);
        ctx.fillRect(nbx + 80, 60, 140, 100);
    }
    // Layer 2 (0.18x): distant planets
    var planetDefs = [
        { r:28, col:'#8855aa', ring:true  },
        { r:18, col:'#3355cc', ring:false },
        { r:22, col:'#cc6622', ring:false }
    ];
    for (var pl = 0; pl < 3; pl++) {
        var pd  = planetDefs[pl];
        var plx = ((pl * 310 - cameraX * 0.18) % (W + 400) + W + 400) % (W + 400) - 100;
        var ply = 60 + pl * 55;
        ctx.fillStyle = pd.col;
        ctx.beginPath();
        ctx.arc(plx, ply, pd.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.beginPath();
        ctx.arc(plx - pd.r * 0.3, ply - pd.r * 0.3, pd.r * 0.4, 0, Math.PI * 2);
        ctx.fill();
        if (pd.ring) {
            ctx.strokeStyle = 'rgba(200,160,80,0.55)';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.ellipse(plx, ply, pd.r * 1.8, pd.r * 0.4, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.lineWidth = 1;
        }
    }
    // Neon road glow
    ctx.fillStyle = 'rgba(0,255,120,0.07)';
    ctx.fillRect(0, ROAD_Y - 20, W, 20);
}

// ==================== DRAW: ROAD SURFACE ====================
function drawRoad() {
    var b = BIOMES[currentBiomeIdx];

    // Verge / shoulder strip
    ctx.fillStyle = b.dirtColor;
    ctx.fillRect(0, ROAD_Y - 14, W, 14);

    // Road body
    ctx.fillStyle = b.roadColor;
    ctx.fillRect(0, ROAD_Y, W, H - ROAD_Y);

    // Road top edge line
    ctx.fillStyle = b.roadEdge;
    ctx.fillRect(0, ROAD_Y, W, 4);

    // Dashed center line — scrolls with camera
    ctx.fillStyle = b.roadLine;
    var dashW  = 40, dashGap = 30;
    var offset = (cameraX * 0.8) % (dashW + dashGap);
    for (var x = -offset; x < W + dashW; x += dashW + dashGap) {
        ctx.fillRect(x, ROAD_Y + Math.floor((H - ROAD_Y) * 0.44), dashW, 4);
    }
}

// ==================== OBSTACLE GENERATION ====================
// Obstacle types:
//   ramp    — wedge that launches kart airborne (3 sizes)
//   barrier — striped wall that must be jumped over
//   pothole — road dimple that bumps the kart slightly
//   patch   — biome hazard on the road surface (kind: sand / oil / ice / lowg)

function generateObstacles() {
    while (nextObstacleX < cameraX + GEN_AHEAD) {
        var gap  = Math.max(260, randBetween(320, 620) / (1 + (gpLevel - 1) * 0.12));
        var roll = Math.random();
        var obj  = null;
        var hazard = BIOMES[currentBiomeIdx].hazard;
        if (boss) roll = roll < 0.5 ? 0 : 1;   // boss fights: only ramps on the road
        // Ramps more common than barriers; potholes and biome hazards sprinkled in
        if (roll < 0.36) {
            // ramp: small / medium / large
            var sizes = [
                { w:52,  h:28 },
                { w:68,  h:48 },
                { w:85,  h:70 }
            ];
            var sz = sizes[Math.floor(Math.random() * 3)];
            obj = { type:'ramp', worldX:nextObstacleX, w:sz.w, h:sz.h, used:false };
        } else if (roll < 0.58) {
            // barrier — tall enough to require jumping
            obj = { type:'barrier', worldX:nextObstacleX, w:20, h:44 };
        } else if (roll < 0.72) {
            // pothole
            obj = { type:'pothole', worldX:nextObstacleX, w:44, h:12 };
        } else if (roll < 0.90 && hazard) {
            var pw = hazard === 'lowg' ? randBetween(260, 380) : randBetween(110, 200);
            obj = { type:'patch', kind:hazard, worldX:nextObstacleX, w:pw, h:10 };
            gap += pw + (hazard === 'oil' ? 200 : 0);   // room to recover before the next obstacle
        }
        // Otherwise: no obstacle in this gap (open road)
        if (obj) obstacles.push(obj);
        nextObstacleX += gap;
    }
}

function cullObstacles() {
    obstacles = obstacles.filter(function(o) {
        return o.worldX + o.w > cameraX - CULL_BEHIND;
    });
}

// ==================== OBSTACLE COLLISION ====================
function checkObstacleCollisions() {
    var ks = KART_SCREEN_X;   // kart screen x (always fixed)
    for (var i = 0; i < obstacles.length; i++) {
        var o  = obstacles[i];
        var ox = o.worldX - cameraX;  // screen x of obstacle left edge

        // Off-screen — skip
        if (ox + o.w < -10 || ox > W + 10) continue;

        if (o.type === 'ramp') {
            // The front wheel rides up the slope; leaving the lip launches the kart
            var t = (ks + kart.w - 8 - ox) / o.w;
            if (t >= 0 && t <= 1 && kart.dy >= 0) {
                var surf = ROAD_Y - o.h * t;
                if (kart.y + kart.h >= surf - 2) {
                    if (kart.state === 'air') landKart();
                    kart.y = surf - kart.h; kart.dy = 0;
                    kart.state = 'ground'; kart.airJumps = 0;
                    kart.onRamp = o;
                    kart.tilt = -Math.atan2(o.h, o.w);
                }
            } else if (kart.onRamp === o && t > 1) {
                kart.onRamp = null;
                // Tall ramps stay just under the top of the screen, even with Off-Road Tires
                var lift = -(6 + o.h * 0.12) * (activeUpgrades.indexOf('off_road_tires') !== -1 ? 1.15 : 1);
                kart.dy    = lift;
                kart.state = 'air';
                kart.airJumps = 0;
                sfxRamp();
                spawnRocketFlame(ks - 4, kart.y + kart.h - 4);
            }

        } else if (o.type === 'barrier') {
            // Barrier top is at ROAD_Y - o.h
            var barrierTop = ROAD_Y - o.h;
            var hitX = ks + kart.w - 4 > ox + 2 && ks + 4 < ox + o.w - 2;
            var hitY = kart.y + kart.h - 4 > barrierTop && kart.y + 4 < ROAD_Y;
            if (o.smashed || !hitX || !hitY) continue;
            if (kart.boostTimer > 0) {
                // Boost rams straight through barriers
                o.smashed = true;
                spawnSparks(ox + o.w / 2, barrierTop + 10);
                spawnExplosion(ox + o.w / 2, barrierTop + o.h / 2);
                sfxKill();
                shakeFrames = 4; shakeMagnitude = 3;
            } else {
                hurtKart(HIT_DAMAGE, ox + o.w / 2, barrierTop);
            }

        } else if (o.type === 'pothole') {
            // Pothole bumps the kart upward and triggers a small dust puff
            if (!o.used && kart.state === 'ground' &&
                ks + kart.w - 6 > ox + 4 && ks + 6 < ox + o.w - 4) {
                o.used  = true;
                kart.dy = -2.5;      // small bump
                kart.state = 'air';
                spawnDust(ks + kart.w / 2, ROAD_Y);
                sfxLand();           // thud sound reused
            }
        }
    }
}

// ==================== OBSTACLE DRAWING ====================
function drawObstacles() {
    var b = BIOMES[currentBiomeIdx];
    for (var i = 0; i < obstacles.length; i++) {
        var o  = obstacles[i];
        var ox = o.worldX - cameraX;
        if (ox + o.w < -20 || ox > W + 20) continue;

        if (o.type === 'ramp') {
            // Draw as a filled ramp wedge rising left-to-right
            var slope = o.h;
            ctx.fillStyle = b.roadEdge;
            ctx.beginPath();
            ctx.moveTo(ox,        ROAD_Y);
            ctx.lineTo(ox + o.w,  ROAD_Y);
            ctx.lineTo(ox + o.w,  ROAD_Y - slope);
            ctx.closePath();
            ctx.fill();
            // Highlight top edge of ramp
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(ox + o.w - 4, ROAD_Y - slope - 2, 6, 4);
            // Arrow hint
            ctx.fillStyle = '#ffee00';
            ctx.fillRect(ox + Math.floor(o.w * 0.35), ROAD_Y - Math.floor(slope * 0.55), 8, 4);
            ctx.fillRect(ox + Math.floor(o.w * 0.55), ROAD_Y - Math.floor(slope * 0.72), 8, 4);

        } else if (o.type === 'barrier' && o.drum) {
            if (o.smashed) continue;
            var dt = ROAD_Y - o.h;
            ctx.fillStyle = '#3a5a8a';
            ctx.fillRect(ox, dt, o.w, o.h);
            ctx.fillStyle = '#5a7aaa';
            ctx.fillRect(ox, dt + 6, o.w, 4);
            ctx.fillRect(ox, dt + o.h - 10, o.w, 4);
            ctx.fillStyle = '#ffcc00';
            ctx.fillRect(ox + 6, dt + 16, o.w - 12, 8);

        } else if (o.type === 'barrier') {
            if (o.smashed) continue;
            var bt = ROAD_Y - o.h;
            // Post
            ctx.fillStyle = '#cc8800';
            ctx.fillRect(ox + 6, bt, 8, o.h);
            // Striped hazard bands
            for (var strip = 0; strip < 5; strip++) {
                ctx.fillStyle = strip % 2 === 0 ? '#ff6600' : '#ffffff';
                ctx.fillRect(ox, bt + strip * (o.h / 5), o.w, Math.ceil(o.h / 5));
            }
            // Top cap
            ctx.fillStyle = '#ffcc00';
            ctx.fillRect(ox - 2, bt - 4, o.w + 4, 6);
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.25)';
            ctx.fillRect(ox + o.w, bt, 5, o.h);

        } else if (o.type === 'patch') {
            drawPatch(o, ox);

        } else if (o.type === 'pothole') {
            // Oval depression on road
            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath();
            ctx.ellipse(ox + o.w / 2, ROAD_Y + 4, o.w / 2, 8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(0,0,0,0.40)';
            ctx.beginPath();
            ctx.ellipse(ox + o.w / 2, ROAD_Y + 2, o.w / 2 - 4, 5, 0, 0, Math.PI * 2);
            ctx.fill();
        }
    }
}

function drawPatch(o, ox) {
    var i;
    if (o.kind === 'sand') {
        ctx.fillStyle = '#d8b868';
        ctx.fillRect(ox, ROAD_Y - 3, o.w, 9);
        ctx.fillRect(ox + 10, ROAD_Y - 7, o.w - 20, 5);
        ctx.fillStyle = '#b89848';
        for (i = 8; i < o.w - 8; i += 14) ctx.fillRect(ox + i, ROAD_Y + 1 + (i % 3), 4, 2);
    } else if (o.kind === 'oil') {
        ctx.fillStyle = '#101018';
        ctx.beginPath();
        ctx.ellipse(ox + o.w / 2, ROAD_Y + 3, o.w / 2, 7, 0, 0, Math.PI * 2);
        ctx.fill();
        var sheen = ['rgba(255,80,200,0.35)', 'rgba(80,200,255,0.35)', 'rgba(255,240,80,0.30)'];
        for (i = 0; i < 3; i++) {
            ctx.fillStyle = sheen[i];
            ctx.fillRect(ox + o.w * (0.2 + i * 0.22), ROAD_Y + 1 + i, o.w * 0.16, 2);
        }
    } else if (o.kind === 'ice') {
        ctx.fillStyle = 'rgba(190,235,255,0.75)';
        ctx.fillRect(ox, ROAD_Y - 2, o.w, 10);
        ctx.fillStyle = '#ffffff';
        for (i = 6; i < o.w - 10; i += 22) ctx.fillRect(ox + i, ROAD_Y + 1, 12, 2);
    } else if (o.kind === 'fire') {
        for (i = 0; i < o.w; i += 8) {
            var fh = 10 + Math.sin(frameCount * 0.4 + i) * 5 + (i % 16 ? 4 : 0);
            ctx.fillStyle = '#ff5500';
            ctx.fillRect(ox + i, ROAD_Y - fh, 8, fh + 4);
            ctx.fillStyle = '#ffcc00';
            ctx.fillRect(ox + i + 2, ROAD_Y - fh * 0.5, 4, fh * 0.5 + 2);
        }
    } else if (o.kind === 'lowg') {
        var pulse = 0.5 + 0.5 * Math.sin(frameCount * 0.1);
        ctx.fillStyle = 'rgba(170,90,255,0.07)';
        ctx.fillRect(ox, 60, o.w, ROAD_Y - 60);
        ctx.fillStyle = 'rgba(190,120,255,' + (0.45 + pulse * 0.35) + ')';
        ctx.fillRect(ox, ROAD_Y - 2, o.w, 6);
        ctx.fillStyle = '#e0c0ff';
        for (i = 0; i < o.w; i += 30) {
            var py = ROAD_Y - 10 - ((frameCount * 1.5 + i * 7) % 220);
            ctx.fillRect(ox + i + 8, py, 2, 6);
        }
    }
}

// ==================== DRAW: KART SPRITE ====================
// k is the player kart, a rival, or a preview object with the same fields:
// { state, animFrame, invincible, shield, paint, boostTimer, rot, driver }.
// groundY is optional (used for previews away from the road).
function drawKart(k, x, y, groundY) {
    groundY = groundY || ROAD_Y;
    ctx.save();
    if (k.invincible > 0 && Math.floor(k.invincible / 5) % 2 === 0) ctx.globalAlpha = 0.45;

    // Subtle bounce on ground
    var bounce = k.state === 'ground' ? Math.sin(frameCount * 0.30) * 1.0 : 0;
    y += bounce;

    // ── Shadow — shrinks & fades as kart rises ──
    var groundDist = Math.max(0, groundY - (y + kart.h)); // pixels above road
    var shadowScale = Math.max(0.15, 1 - groundDist / 200);
    var shadowAlpha = Math.max(0.05, 0.28 * shadowScale);
    var shadowW = Math.round((kart.w - 6) * shadowScale);
    var shadowX = x + 4 + Math.round(((kart.w - 6) - shadowW) / 2);
    ctx.fillStyle = 'rgba(0,0,0,' + shadowAlpha + ')';
    ctx.fillRect(shadowX, groundY - 3, shadowW, Math.max(2, Math.round(5 * shadowScale)));

    // Flips and ramp tilt rotate the kart around its centre
    if (k.rot) {
        ctx.translate(x + 26, y + 16);
        ctx.rotate(k.rot);
        ctx.translate(-(x + 26), -(y + 16));
    }

    // ── Kart body ──
    var paint = k.paint || ABILITY_POOL[0].paint;
    var driver = k.driver || '#f5c842';
    ctx.fillStyle = paint[0];
    ctx.fillRect(x + 6,  y + 14, 40, 14);   // main chassis
    ctx.fillStyle = paint[1];
    ctx.fillRect(x + 8,  y + 12, 38,  5);   // top highlight strip
    ctx.fillStyle = paint[2];
    ctx.fillRect(x + 6,  y + 26, 40,  2);   // underside shadow

    // ── Side exhaust pipes ──
    ctx.fillStyle = '#7a7a8a';
    ctx.fillRect(x,      y + 17, 7,  3);
    ctx.fillRect(x,      y + 22, 7,  3);

    // Exhaust glow when boosting
    if (k.boostTimer > 0) {
        ctx.fillStyle = 'rgba(255,160,0,0.75)';
        ctx.fillRect(x - 4,  y + 16, 5, 4);
        ctx.fillRect(x - 4,  y + 21, 5, 4);
    }

    // ── Cockpit / windshield ──
    ctx.fillStyle = '#1a3366';
    ctx.fillRect(x + 22, y + 5,  22, 11);   // windshield glass
    ctx.fillStyle = '#2244aa';
    ctx.fillRect(x + 24, y + 6,  14,  4);   // reflection streak

    // ── Duck in cockpit ──
    // Body
    ctx.fillStyle = driver;
    ctx.fillRect(x + 25, y + 2,  14, 10);
    // Head
    ctx.fillStyle = driver;
    ctx.fillRect(x + 31, y - 2,  10,  8);
    // Beak
    ctx.fillStyle = '#e07820';
    ctx.fillRect(x + 39, y + 1,   5,  3);
    // Eye socket
    ctx.fillStyle = '#111111';
    ctx.fillRect(x + 37, y - 1,   3,  3);
    // Eye highlight
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x + 38, y - 1,   1,  1);
    // Wing — waves on alternating frames
    ctx.fillStyle = '#c89820';
    var wf = (k.animFrame || 0) % 2;
    ctx.fillRect(x + 24, y + 4 + (wf === 0 ? 2 : 0), 6, 4);

    // ── Big rear wheels ──
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(x + 1,  y + 20, 16, 16);   // tire
    ctx.fillStyle = '#333333';
    ctx.fillRect(x + 3,  y + 22, 12, 12);
    ctx.fillStyle = '#666666';
    ctx.fillRect(x + 7,  y + 26,  4,  4);   // hub cap
    ctx.fillStyle = '#999999';
    ctx.fillRect(x + 8,  y + 27,  2,  2);   // hub shine

    // ── Small front wheels ──
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(x + 35, y + 22, 12, 12);   // tire
    ctx.fillStyle = '#333333';
    ctx.fillRect(x + 37, y + 24,  8,  8);
    ctx.fillStyle = '#666666';
    ctx.fillRect(x + 40, y + 27,  2,  2);   // hub cap

    // ── Front bumper ──
    ctx.fillStyle = '#ffcc00';
    ctx.fillRect(x + 46, y + 16,  5,  8);
    ctx.fillStyle = '#ffaa00';
    ctx.fillRect(x + 47, y + 17,  3,  6);

    // ── Shield bubble ──
    if (k.shield) {
        ctx.strokeStyle = 'rgba(100,200,255,0.85)';
        ctx.lineWidth   = 3;
        ctx.beginPath();
        ctx.arc(x + 26, y + 15, 28, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = 'rgba(100,200,255,0.10)';
        ctx.fill();
        ctx.lineWidth = 1;
    }

    ctx.restore();
}

// ==================== DRAW: TITLE SCREEN ====================

// ==================== CARD LAYOUT ====================
// Shared by the ability pick and pit stop screens for drawing, hover and clicks
function cardLayout(n, cw, ch, gap, y) {
    var x0 = (W - (n * cw + (n - 1) * gap)) / 2, rects = [];
    for (var i = 0; i < n; i++) rects.push({ x:x0 + i * (cw + gap), y:y, w:cw, h:ch });
    return rects;
}

function mouseIn(r) {
    return mouseX >= r.x && mouseX <= r.x + r.w && mouseY >= r.y && mouseY <= r.y + r.h;
}

// ==================== DRAW: ABILITY PICK ====================
function drawAbilityPick() {
    ctx.fillStyle = 'rgba(6,10,20,0.97)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.font = 'bold 30px Courier New';
    ctx.fillStyle = '#ff8800';
    ctx.fillText('CHOOSE YOUR KART', W/2, 66);

    ctx.font = '14px Courier New';
    ctx.fillStyle = '#8888aa';
    ctx.fillText('Your kart shapes the entire run', W/2, 92);

    var rects = cardLayout(abilityChoices.length, 194, 200, 14, 116);
    for (var i = 0; i < abilityChoices.length; i++) {
        var ab  = abilityChoices[i];

        var t = toasts[i];

        ctx.strokeStyle = '#ff8800';
        ctx.lineWidth   = 1.5;

        ctx.textAlign = 'right';

// ==================== STATE CHANGES ====================
var achReturnState = 'TITLE';

function openAchievements(from) {
    achReturnState = from;
    gameState = 'ACHIEVEMENTS';
}

function closeAchievements() {
    gameState = achReturnState;
}

function pauseGame() {
    if (gameState !== 'PLAYING' || isDying) return;
    gameState = 'PAUSED';
    keyHeld = {};
    trickHeld = false;
    stopMusic();
}

function resumeGame() {
    if (gameState !== 'PAUSED') return;
    gameState = 'PLAYING';
    startMusic(boss ? 5 : BIOMES[currentBiomeIdx].musicIdx);
}

function quitToTitle() {
    stopMusic();
    gameState = 'TITLE';
    document.getElementById('hud').style.display = 'none';
}

document.addEventListener('visibilitychange', function() {
    if (document.hidden) pauseGame();
});

// ==================== DRAW: SPEED LINES ====================
function drawSpeedLines() {
    var alpha = Math.min(0.55, kart.boostTimer / 22);
    if (alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth   = 1.5;
    for (var i = 0; i < 12; i++) {
        var ly  = 180 + Math.sin((frameCount * 0.3 + i * 41) % (Math.PI * 2)) * 120;
        var lx  = KART_SCREEN_X + kart.w + 8 + (i % 4) * 18;
        var len = 24 + (i % 3) * 14;
        ctx.beginPath();
        ctx.moveTo(lx, ly);
        ctx.lineTo(lx - len, ly);
        ctx.stroke();
    }
    ctx.restore();
}
