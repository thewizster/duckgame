name: Forge review

# Review: every push to a branch with an open PR (synchronize), plus open/reopen/ready.
# Gate re-checks: label changes, submitted/dismissed reviews and new review comments
# (comment edits can't change thread state, so they don't trigger). Actions has no
# trigger for resolving a thread (pull_request_review_thread is webhook-only and would
# invalidate this file), so after resolving, reply in a thread or re-run the gate.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

# Review runs (pull_request) never cancel each other. Re-check bursts (review/comment
# events, e.g. replying to many threads) share a separate group and collapse to the
# latest run; the gate is a cheap, idempotent GraphQL read.
concurrency:
  group: forge-review-${{ github.event.pull_request.number }}-${{ github.event_name == 'pull_request' && 'review' || 'recheck' }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

jobs:
  review:
    name: Forge review
    if: >-
      github.event_name == 'pull_request' &&
      contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Forge review against the diff
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/forge/review.py

  # Runs even when review is skipped (re-checks on label/review events) or fails.
  # gate.py blocks if review failed/cancelled, or if no Forge review exists for
  # the current head commit (draft/fork PRs, a failed run), so "skipped" can't pass.
  gate:
    name: Forge review gate
    needs: [review]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block merge while Forge threads are unresolved
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          REVIEW_RESULT: ${{ needs.review.result }}
        run: python3 .github/forge/gate.py
